<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Almacén Copihue · Cotización</title>
<style>
  :root{
    --azul:#1565c0;
    --azul-dark:#0d47a1;
    --verde:#2e7d32;
    --verde-dark:#1b5e20;
    --bg:#f4f7f6;
    --card:#ffffff;
    --txt:#1b2430;
    --sub:#5b6b78;
    --bdr:#e1e8ec;
    --danger:#c62828;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  img{max-width:100%;display:block;}

  /* ---------- HEADER ---------- */
  header{
    background:linear-gradient(135deg,var(--azul) 0%,var(--azul-dark) 100%);
    color:#fff;padding:14px 16px 16px;position:sticky;top:0;z-index:30;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  header .top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  header h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.2px;}
  header .badge{font-size:10px;background:rgba(255,255,255,.18);padding:3px 8px;
    border-radius:20px;font-weight:600;white-space:nowrap;}
  .conn-dot{width:10px;height:10px;border-radius:50%;background:#9e9e9e;
    display:inline-block;border:2px solid rgba(255,255,255,.55);flex:0 0 10px;}
  .conn-dot.red{background:#e53935;}
  .conn-dot.yellow{background:#fdd835;}
  .conn-dot.green{background:#43a047;}
  .badge-wrap{display:flex;align-items:center;gap:6px;}
  header .tag{font-size:12px;opacity:.85;margin-top:2px;}

  /* ---------- SEARCH ---------- */
  .search-wrap{padding:10px 16px 0;background:linear-gradient(135deg,var(--azul) 0%,var(--azul-dark) 100%);}
  .search-box{position:relative;}
  .search-box input{
    width:100%;padding:12px 40px 12px 14px;border:none;border-radius:12px;
    font-size:15px;background:#fff;color:var(--txt);outline:none;
  }
  .search-box .ico{position:absolute;right:12px;top:50%;transform:translateY(-50%);
    font-size:16px;color:var(--sub);}
  .search-box .clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);
    background:var(--bdr);color:var(--sub);border:none;border-radius:50%;width:22px;height:22px;
    font-size:13px;line-height:1;cursor:pointer;display:none;}

  /* ---------- CHIPS ---------- */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 14px;
    background:linear-gradient(135deg,var(--azul) 0%,var(--azul-dark) 100%);
    scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);
    padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;
    transition:.15s;}
  .chip.active{background:var(--verde);border-color:var(--verde);}
  .chip:active{transform:scale(.96);}

  /* ---------- CONTENT ---------- */
  main{padding:14px 16px 110px;max-width:640px;margin:0 auto;}
  .section-title{font-size:14px;font-weight:800;color:var(--verde-dark);margin:6px 2px 10px;
    display:flex;align-items:center;gap:6px;}
  .section-sub{font-size:12px;color:var(--sub);margin:-6px 2px 12px;}

  .estado{text-align:center;color:var(--sub);font-size:13px;padding:30px 10px;}
  .estado.error{color:var(--danger);}

  .grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .card{
    background:var(--card);border:1px solid var(--bdr);border-radius:14px;
    display:flex;align-items:center;gap:12px;padding:10px;cursor:pointer;
    transition:.12s;position:relative;
  }
  .card:active{transform:scale(.985);}
  .card.selected{border-color:var(--verde);background:#f1f8f1;}
  .card .thumb{width:52px;height:52px;border-radius:10px;background:#eef2f4;flex:0 0 52px;
    display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;}
  .card .thumb img{width:100%;height:100%;object-fit:cover;}
  .card .info{flex:1;min-width:0;}
  .card .name{font-size:13.5px;font-weight:700;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card .meta{font-size:11px;color:var(--sub);margin-top:3px;}
  .card .price{font-size:15px;font-weight:800;color:var(--azul-dark);white-space:nowrap;margin-top:2px;}
  .card .badge-info{display:inline-block;font-size:10px;font-weight:700;background:#fff3e0;color:#e65100;
    border-radius:6px;padding:2px 6px;margin-top:4px;}
  .card .check{flex:0 0 26px;width:26px;height:26px;border-radius:50%;border:2px solid var(--bdr);
    display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;
    transition:.15s;}
  .card.selected .check{background:var(--verde);border-color:var(--verde);color:#fff;}

  /* ---------- FLOATING CART BAR ---------- */
  .cart-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--verde-dark);color:#fff;padding:12px 16px;
    display:none;align-items:center;justify-content:space-between;
    box-shadow:0 -4px 16px rgba(0,0,0,.18);cursor:pointer;}
  .cart-bar.show{display:flex;}
  .cart-bar .l{font-size:13px;font-weight:700;}
  .cart-bar .l small{display:block;font-weight:400;opacity:.85;font-size:11px;}
  .cart-bar .r{font-size:17px;font-weight:800;}

  /* ---------- CART OVERLAY ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;}
  .overlay.show{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;background:#fff;
    border-radius:18px 18px 0 0;z-index:51;display:flex;flex-direction:column;
    transform:translateY(100%);transition:.22s ease;}
  .sheet.show{transform:translateY(0);}
  .sheet-head{padding:16px;border-bottom:1px solid var(--bdr);display:flex;
    align-items:center;justify-content:space-between;}
  .sheet-head h2{font-size:16px;margin:0;font-weight:800;}
  .sheet-head button{background:none;border:none;font-size:22px;color:var(--sub);cursor:pointer;}
  .sheet-list{overflow-y:auto;padding:8px 16px;flex:1;}
  .sheet-item{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 0;border-bottom:1px solid #f0f2f4;}
  .sheet-item .nm{font-size:13.5px;font-weight:600;flex:1;}
  .sheet-item .pr{font-size:13.5px;font-weight:800;color:var(--azul-dark);white-space:nowrap;}
  .sheet-item .rm{background:#fdecea;color:var(--danger);border:none;border-radius:50%;
    width:26px;height:26px;font-size:14px;cursor:pointer;flex:0 0 26px;}
  .sheet-foot{padding:14px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--bdr);}
  .sheet-foot .total-row{display:flex;justify-content:space-between;font-size:15px;font-weight:800;margin-bottom:10px;}
  .sheet-foot .empty-btn{width:100%;padding:12px;border:none;border-radius:12px;
    background:#f1f3f4;color:var(--sub);font-weight:700;font-size:13px;cursor:pointer;}
  .share-row{display:flex;gap:8px;margin-bottom:8px;}
  .share-row button{flex:1;padding:12px 6px;border:none;border-radius:12px;
    font-weight:800;font-size:13px;cursor:pointer;display:flex;align-items:center;
    justify-content:center;gap:6px;}
  .btn-compartir{background:var(--azul);color:#fff;}
  .btn-pedido{background:var(--verde);color:#fff;}
  .sheet-empty{text-align:center;color:var(--sub);font-size:13px;padding:30px 10px;}

  .fmt{font-variant-numeric:tabular-nums;}
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>🏪 Almacén Copihue</h1>
    <div class="badge-wrap">
      <span class="conn-dot" id="connDot" title="Conectando..."></span>
      <span class="badge" id="badgeVersion"></span>
    </div>
  </div>
  <div class="tag">Buscá productos y armá tu cotización</div>
</header>

<div class="search-wrap">
  <div class="search-box">
    <input type="text" id="inputBuscar" placeholder="Buscar producto..." autocomplete="off">
    <span class="ico" id="icoBuscar">🔍</span>
    <button class="clear-btn" id="btnLimpiarBusqueda">✕</button>
  </div>
</div>

<div class="chips">
  <div class="chip" data-cat="recientes">🆕 Últimos en llegar</div>
  <div class="chip" data-cat="relampago">⚡ Relámpago</div>
  <div class="chip" data-cat="combos">🎁 Combos</div>
  <div class="chip" data-cat="multicompra">🛒 Promos/Multicompra</div>
  <div class="chip" data-cat="masvendidos">🔥 Más vendidos</div>
</div>

<main>
  <div id="tituloSeccion"></div>
  <div id="contenido">
    <div class="estado">Escribí el nombre de un producto o tocá una categoría para empezar 👆</div>
  </div>
</main>

<div class="cart-bar" id="cartBar">
  <div class="l">
    <span id="cartCount">0 productos</span>
    <small>Tocá para ver tu cotización</small>
  </div>
  <div class="r fmt" id="cartTotal">$0</div>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <h2>Tu cotización</h2>
    <button id="btnCerrarSheet">✕</button>
  </div>
  <div class="sheet-list" id="sheetList"></div>
  <div class="sheet-foot">
    <div class="total-row"><span>Total estimado</span><span class="fmt" id="sheetTotal">$0</span></div>
    <div class="share-row">
      <button class="btn-compartir" id="btnCompartir">📤 Compartir</button>
      <button class="btn-pedido" id="btnPedido">📱 Hacer pedido</button>
    </div>
    <button class="empty-btn" id="btnVaciar">Vaciar cotización</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ═══════════════════════════════════════════════════════════
  //  VERSIÓN — única fuente de verdad para título y badge
  // ═══════════════════════════════════════════════════════════
  const APP_VERSION = 'v2';
  document.title = 'Almacén Copihue · Cotización ' + APP_VERSION;
  document.getElementById('badgeVersion').textContent = APP_VERSION;

  // Mismo endpoint que usan seba21 / index / flyer
  const GAS = 'https://script.google.com/macros/s/AKfycbzWZzDvdGfW8vd2-FpQolT852cdPMeHbfKugn9DBOlju75bE1D0SUNB5EKEDOsI2vP4lA/exec';

  // TODO: hardcodeado por ahora. Pendiente: mover a una fila propia en
  // config_sistema (ej. clave "whatsapp local") y leerlo vía getConfig()
  // para no tener que redeployar el HTML si el número cambia.
  // Formato wa.me para Argentina: 549 + código de área (sin el 0) + número (sin el 15).
  const NUMERO_LOCAL_WA = '5492944907380';

  // ═══════════════════════════════════════════════════════════
  //  ESTADO
  // ═══════════════════════════════════════════════════════════
  let PRODUCTOS_ALL = [];          // catálogo completo {id,name,price,category,stock,...}
  let PRODUCTOS_POR_ID = {};       // id -> producto (catálogo)
  let ofertasCache = null;         // respuesta de getOfertas, cacheada en memoria
  let masVendidosCache = null;     // respuesta de getMasVendidos, cacheada en memoria
  const seleccion = new Map();     // id -> {id, name, price} — persiste entre búsquedas/categorías
  let catActiva = null;

  const $ = (id) => document.getElementById(id);
  const contenido   = $('contenido');
  const tituloSec   = $('tituloSeccion');
  const inputBuscar = $('inputBuscar');

  // ═══════════════════════════════════════════════════════════
  //  HELPERS
  // ═══════════════════════════════════════════════════════════
  function normalizar(s){
    return String(s || '')
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }
  function money(n){
    return '$' + Math.round(n || 0).toLocaleString('es-AR');
  }
  function simplificarNombre(nombre){
    return String(nombre || '')
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9 ]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-')
      .trim();
  }
  function imgSrc(nombre){
    return 'imagenes-productos/' + simplificarNombre(nombre) + '.jpg';
  }
  // Normaliza los distintos formatos de producto que devuelven los
  // diferentes endpoints (getOfertas mezcla name/price con nombre/precio
  // según el pool) a una forma única para renderizar tarjetas.
  function normProd(p){
    return {
      id: p.id,
      name: p.name || p.nombre || '',
      price: (p.price !== undefined ? p.price : p.precio) || 0,
      stock: p.stock !== undefined ? p.stock : 0,
      category: p.category || p.categoria || '',
      extra: p.extra || ''
    };
  }

  // ═══════════════════════════════════════════════════════════
  //  ESTADO DE CONEXIÓN — punto rojo/amarillo/verde en el header
  //  rojo    = sin internet (navigator.onLine === false)
  //  amarillo = hay internet pero el último pedido al backend falló
  //  verde   = último pedido al backend respondió bien
  // ═══════════════════════════════════════════════════════════
  const connDot = $('connDot');
  function setConexion(estado){
    connDot.classList.remove('red', 'yellow', 'green');
    if (estado === 'offline'){
      connDot.classList.add('red');
      connDot.title = 'Sin conexión a internet';
    } else if (estado === 'degraded'){
      connDot.classList.add('yellow');
      connDot.title = 'Hay internet, pero no pudimos conectar con el sistema';
    } else {
      connDot.classList.add('green');
      connDot.title = 'Conectado';
    }
  }
  window.addEventListener('online',  () => setConexion('online'));
  window.addEventListener('offline', () => setConexion('offline'));
  setConexion(navigator.onLine ? 'online' : 'offline');

  async function fetchJSON(url){
    if (!navigator.onLine){
      setConexion('offline');
      throw new Error('Sin conexión a internet');
    }
    try {
      const res = await fetch(url);
      const data = await res.json();
      setConexion('online');
      return data;
    } catch(e){
      setConexion('degraded');
      throw e;
    }
  }

  // ═══════════════════════════════════════════════════════════
  //  CARGA INICIAL — catálogo completo (para el buscador)
  // ═══════════════════════════════════════════════════════════
  async function cargarCatalogo(){
    try {
      const data = await fetchJSON(GAS + '?t=' + Date.now());
      PRODUCTOS_ALL = Array.isArray(data.productos) ? data.productos : [];
      PRODUCTOS_POR_ID = {};
      PRODUCTOS_ALL.forEach(p => { PRODUCTOS_POR_ID[p.id] = p; });
    } catch(e){
      console.error('Error cargando catálogo', e);
    }
  }

  // ═══════════════════════════════════════════════════════════
  //  RENDER — tarjetas de productos
  // ═══════════════════════════════════════════════════════════
  function renderProductos(lista){
    if (!lista.length){
      contenido.innerHTML = '<div class="estado">No encontramos productos disponibles acá 🤔</div>';
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'grid';
    lista.forEach(p => grid.appendChild(crearCard(p)));
    contenido.innerHTML = '';
    contenido.appendChild(grid);
  }

  function crearCard(p){
    const sel = seleccion.has(p.id);
    const div = document.createElement('div');
    div.className = 'card' + (sel ? ' selected' : '');
    div.innerHTML = `
      <div class="thumb"><img src="${imgSrc(p.name)}" onerror="this.parentElement.innerHTML='🛒'" alt=""></div>
      <div class="info">
        <div class="name">${p.name}</div>
        ${p.extra ? `<div class="badge-info">${p.extra}</div>` : ''}
      </div>
      <div style="text-align:right">
        <div class="price fmt">${money(p.price)}</div>
      </div>
      <div class="check">✓</div>
    `;
    div.addEventListener('click', () => toggleSeleccion(p, div));
    return div;
  }

  function toggleSeleccion(p, cardEl){
    if (seleccion.has(p.id)){
      seleccion.delete(p.id);
      cardEl.classList.remove('selected');
    } else {
      seleccion.set(p.id, { id: p.id, name: p.name, price: p.price });
      cardEl.classList.add('selected');
    }
    actualizarCartBar();
  }

  // ═══════════════════════════════════════════════════════════
  //  BUSCADOR — filtra el catálogo completo, sin perder selección
  // ═══════════════════════════════════════════════════════════
  let debounceTimer = null;
  inputBuscar.addEventListener('input', () => {
    $('btnLimpiarBusqueda').style.display = inputBuscar.value ? 'block' : 'none';
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(ejecutarBusqueda, 120);
  });
  $('btnLimpiarBusqueda').addEventListener('click', () => {
    inputBuscar.value = '';
    $('btnLimpiarBusqueda').style.display = 'none';
    inputBuscar.focus();
    mostrarEstadoInicial();
  });

  function ejecutarBusqueda(){
    const q = normalizar(inputBuscar.value.trim());
    setChipActivo(null);
    if (!q){
      mostrarEstadoInicial();
      return;
    }
    tituloSec.innerHTML = '';
    const resultados = PRODUCTOS_ALL
      .filter(p => p.stock > 0 && normalizar(p.name).includes(q))
      .slice(0, 40)
      .map(normProd);
    renderProductos(resultados);
  }

  function mostrarEstadoInicial(){
    tituloSec.innerHTML = '';
    contenido.innerHTML = '<div class="estado">Escribí el nombre de un producto o tocá una categoría para empezar 👆</div>';
  }

  // ═══════════════════════════════════════════════════════════
  //  CATEGORÍAS
  // ═══════════════════════════════════════════════════════════
  const chips = document.querySelectorAll('.chip');
  chips.forEach(chip => {
    chip.addEventListener('click', () => abrirCategoria(chip.dataset.cat, chip));
  });

  function setChipActivo(chipEl){
    chips.forEach(c => c.classList.remove('active'));
    if (chipEl) chipEl.classList.add('active');
  }

  async function abrirCategoria(cat, chipEl){
    inputBuscar.value = '';
    $('btnLimpiarBusqueda').style.display = 'none';
    setChipActivo(chipEl);
    catActiva = cat;
    contenido.innerHTML = '<div class="estado">Cargando…</div>';

    try {
      if (cat === 'combos'){
        mostrarCombos();
        return;
      }
      if (cat === 'masvendidos'){
        await mostrarMasVendidos();
        return;
      }
      // recientes / relampago / multicompra viven en getOfertas
      if (!ofertasCache){
        ofertasCache = await fetchJSON(GAS + '?action=getOfertas&t=' + Date.now());
      }
      if (cat === 'recientes')  mostrarRecientes();
      if (cat === 'relampago')  mostrarRelampago();
      if (cat === 'multicompra') mostrarMulticompra();
    } catch(e){
      console.error(e);
      contenido.innerHTML = '<div class="estado error">No pudimos cargar esta sección. Probá de nuevo en un momento.</div>';
    }
  }

  function setTitulo(txt, sub){
    tituloSec.innerHTML = `<div class="section-title">${txt}</div>` +
      (sub ? `<div class="section-sub">${sub}</div>` : '');
  }

  function mostrarRecientes(){
    const pool = (ofertasCache.poolRecienLlegados || []).map(normProd);
    setTitulo('🆕 Últimos en llegar', pool.length ? '' : 'Todavía no hay productos nuevos cargados esta semana');
    renderProductos(pool);
  }

  function mostrarRelampago(){
    const pool = (ofertasCache.relampagoActivo || []).map(p => {
      const n = normProd(p);
      n.extra = p.relampago ? '⚡ Oferta relámpago' : '';
      return n;
    });
    setTitulo('⚡ Relámpago', pool.length ? 'Ofertas activas ahora mismo' : 'No hay ofertas relámpago activas en este momento');
    renderProductos(pool);
  }

  function mostrarCombos(){
    const pool = PRODUCTOS_ALL
      .filter(p => p.stock > 0 && /COMBO/.test(String(p.category || '').toUpperCase()))
      .map(normProd);
    setTitulo('🎁 Combos', pool.length ? '' : 'No hay combos cargados por ahora');
    renderProductos(pool);
  }

  function mostrarMulticompra(){
    const pool = (ofertasCache.multicompraActiva || []).map(p => {
      const n = normProd(p);
      if (p.MULTICOMPRA_CANTIDAD > 0 && p.MULTICOMPRA_PRECIO > 0){
        n.extra = '🎁 Llevando ' + p.MULTICOMPRA_CANTIDAD + ': ' + money(p.MULTICOMPRA_PRECIO) + ' c/u';
      }
      return n;
    });
    setTitulo('🛒 Promos / Multicompra', pool.length ? 'Comprando varios, sale más barato' : 'No hay promos de multicompra activas ahora');
    renderProductos(pool);
  }

  async function mostrarMasVendidos(){
    if (!masVendidosCache){
      masVendidosCache = await fetchJSON(GAS + '?action=getMasVendidos&t=' + Date.now());
    }
    const pool = (masVendidosCache.productos || []).map(p => {
      const n = normProd(p);
      n.extra = '🔥 De los más elegidos';
      return n;
    });
    setTitulo('🔥 Más vendidos', pool.length ? 'Lo que más se lleva la gente este mes' : 'Todavía no hay ranking disponible');
    renderProductos(pool);
  }

  // ═══════════════════════════════════════════════════════════
  //  CARRITO / COTIZACIÓN
  // ═══════════════════════════════════════════════════════════
  const cartBar = $('cartBar');
  const overlay = $('overlay');
  const sheet   = $('sheet');

  function actualizarCartBar(){
    const items = Array.from(seleccion.values());
    const total = items.reduce((s, i) => s + (i.price || 0), 0);
    if (items.length === 0){
      cartBar.classList.remove('show');
    } else {
      cartBar.classList.add('show');
      $('cartCount').textContent = items.length + (items.length === 1 ? ' producto' : ' productos');
      $('cartTotal').textContent = money(total);
    }
    // Actualizar checkmarks visibles en pantalla si corresponde
    document.querySelectorAll('.card').forEach(card => {
      // no-op: el estado visual ya se actualiza en el toggle puntual
    });
    renderSheet();
  }

  function renderSheet(){
    const items = Array.from(seleccion.values());
    const total = items.reduce((s, i) => s + (i.price || 0), 0);
    $('sheetTotal').textContent = money(total);
    const list = $('sheetList');
    if (!items.length){
      list.innerHTML = '<div class="sheet-empty">Todavía no agregaste productos</div>';
      return;
    }
    list.innerHTML = '';
    items.forEach(it => {
      const row = document.createElement('div');
      row.className = 'sheet-item';
      row.innerHTML = `
        <div class="nm">${it.name}</div>
        <div class="pr fmt">${money(it.price)}</div>
        <button class="rm" data-id="${it.id}">✕</button>
      `;
      row.querySelector('.rm').addEventListener('click', () => quitarDelCarrito(it.id));
      list.appendChild(row);
    });
  }

  function quitarDelCarrito(id){
    seleccion.delete(id);
    // Si la tarjeta sigue visible en pantalla, sacarle el estado "selected"
    document.querySelectorAll('.card.selected').forEach(card => {
      const nameEl = card.querySelector('.name');
      const prod = PRODUCTOS_POR_ID[id];
      if (prod && nameEl && nameEl.textContent === prod.name) card.classList.remove('selected');
    });
    actualizarCartBar();
  }

  // ═══════════════════════════════════════════════════════════
  //  COMPARTIR / HACER PEDIDO
  //  Compartir: selector nativo del celular (WhatsApp, notas, lo que sea),
  //    sin número fijo — sirve tanto para que el cliente comparta su lista
  //    como para que Víctor arme una cotización y se la mande a cualquiera.
  //  Hacer pedido: WhatsApp directo al número del local — ahí ya es un
  //    pedido, no solo una cotización.
  // ═══════════════════════════════════════════════════════════
  function generarTextoCotizacion(){
    const items = Array.from(seleccion.values());
    if (!items.length) return '';
    const total = items.reduce((s, i) => s + (i.price || 0), 0);
    let txt = '🛒 *Cotización Almacén Copihue*\n\n';
    items.forEach(it => { txt += '- ' + it.name + ': ' + money(it.price) + '\n'; });
    txt += '\n*Total: ' + money(total) + '*';
    return txt;
  }

  async function compartirCotizacion(){
    const texto = generarTextoCotizacion();
    if (!texto) return;
    if (navigator.share){
      try { await navigator.share({ text: texto }); return; }
      catch(e){ /* usuario canceló el selector nativo, o no soportado: seguir a WhatsApp genérico */ }
    }
    window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
  }

  function hacerPedido(){
    const texto = generarTextoCotizacion();
    if (!texto) return;
    window.open('https://wa.me/' + NUMERO_LOCAL_WA + '?text=' + encodeURIComponent(texto), '_blank');
  }

  $('btnCompartir').addEventListener('click', compartirCotizacion);
  $('btnPedido').addEventListener('click', hacerPedido);

  cartBar.addEventListener('click', abrirSheet);
  function abrirSheet(){
    overlay.classList.add('show');
    sheet.classList.add('show');
  }
  function cerrarSheet(){
    overlay.classList.remove('show');
    sheet.classList.remove('show');
  }
  overlay.addEventListener('click', cerrarSheet);
  $('btnCerrarSheet').addEventListener('click', cerrarSheet);
  $('btnVaciar').addEventListener('click', () => {
    seleccion.clear();
    document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
    actualizarCartBar();
    cerrarSheet();
  });

  // ═══════════════════════════════════════════════════════════
  //  INIT
  // ═══════════════════════════════════════════════════════════
  cargarCatalogo();
})();
</script>
</body>
</html>
