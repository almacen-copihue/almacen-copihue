<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🧠 Memoria · Copihue</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400;700&display=swap');

  :root {
    --verde: #3f8a53;
    --verde-dark: #2c6b3f;
    --rojo: #b8483d;
    --dorado: #c9a227;
    --crema: #fdf8ec;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overscroll-behavior-y: contain; }

  body {
    background: linear-gradient(160deg, var(--verde) 0%, var(--verde-dark) 100%);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    font-family: 'Lato', sans-serif;
    padding: 16px 12px 40px;
    color: var(--crema);
  }

  .header { text-align: center; margin-bottom: 10px; position: relative; width: 100%; max-width: 460px; }
  .header .emoji { font-size: 2rem; display: block; }
  .header .store-name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.5rem, 6vw, 2.4rem); font-weight: 900;
    text-shadow: 0 2px 6px rgba(0,0,0,0.25);
    letter-spacing: 1px; line-height: 1;
  }
  .header .tagline { font-size: 0.7rem; color: rgba(255,255,255,0.65); letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }
  .app-version { position: absolute; top: 0; right: 4px; font-size: 0.6rem; color: rgba(255,255,255,0.35); letter-spacing: 1px; }

  .stats {
    display: flex; gap: 22px; margin: 14px 0;
    background: rgba(255,255,255,0.1); padding: 8px 22px; border-radius: 14px;
  }
  .stat { text-align: center; }
  .stat .num { font-size: 1.25rem; font-weight: 700; }
  .stat .lbl { font-size: 0.68rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; }

  .state-loading, .state-error { text-align: center; padding: 40px 0; }
  .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.25); border-top-color: var(--dorado); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state-error p { margin-bottom: 10px; font-size: 0.85rem; }
  .btn-retry {
    background: var(--dorado); color: #2c2c2c; border: none; padding: 8px 18px;
    border-radius: 999px; font-weight: 700; cursor: pointer; font-size: 0.85rem;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 460px;
  }
  .card { aspect-ratio: 1 / 1; perspective: 800px; cursor: pointer; }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform 0.45s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; width: 100%; height: 100%; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    backface-visibility: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  }
  .face.back {
    background: linear-gradient(145deg, #d8f3dc, #b7e4c7);
    font-size: 1.5rem;
  }
  .face.back::after { content: "🌺"; opacity: 0.9; }
  .face.front {
    background: #fff;
    transform: rotateY(180deg);
    flex-direction: column;
    padding: 4px;
    gap: 2px;
  }
  .face.front img { width: 60%; height: 60%; object-fit: contain; }
  .face.front .fallback-emoji { font-size: 1.8rem; }
  .face.front .prod-label {
    font-size: clamp(0.42rem, 1.6vw, 0.52rem); font-weight: 700;
    color: var(--rojo); text-transform: uppercase; letter-spacing: 0.3px;
    text-align: center; line-height: 1.15;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card.matched .face.front { background: #ffd166; animation: pop 0.4s ease; }
  @keyframes pop {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.1); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  .win {
    display: none; margin-top: 22px; background: rgba(255,255,255,0.15);
    padding: 16px 26px; border-radius: 16px; text-align: center; max-width: 400px;
  }
  .win.show { display: block; }
  .win h2 { font-size: 1.2rem; margin-bottom: 6px; }
  button.reset {
    margin-top: 16px; background: var(--dorado); color: #2c2c2c; border: none;
    padding: 9px 20px; border-radius: 999px; font-weight: 700; font-size: 0.9rem;
    cursor: pointer;
  }

  footer { margin-top: 22px; font-size: 0.75rem; opacity: 0.65; text-align: center; }
</style>
</head>
<body>

<div class="header">
  <span class="emoji">🌺</span>
  <div class="store-name" id="storeName">Copihue</div>
  <div class="tagline" id="storeTagline">Memoria del almacén</div>
  <div class="app-version" id="appVersion"></div>
</div>

<div class="stats">
  <div class="stat"><div class="num" id="moves">0</div><div class="lbl">Movimientos</div></div>
  <div class="stat"><div class="num" id="pairs">0/0</div><div class="lbl">Pares</div></div>
  <div class="stat"><div class="num" id="time">00:00</div><div class="lbl">Tiempo</div></div>
</div>

<div class="state-loading" id="stateLoading">
  <div class="spinner"></div>
  <p>Cargando productos...</p>
</div>

<div class="state-error" id="stateError" style="display:none">
  <p id="errorMsg">No se pudieron cargar los productos.</p>
  <button class="btn-retry" onclick="iniciar()">🔄 Reintentar</button>
</div>

<div class="board" id="board" style="display:none"></div>

<div class="win" id="win">
  <h2>🎉 ¡Completaste el almacén!</h2>
  <p id="winText"></p>
  <button class="reset" onclick="startGame()">Jugar de nuevo</button>
</div>

<footer>El Almacén Copihue 🌸</footer>

<script>
// ═══════════════════════════════════════════════════════════════
//  VERSIÓN
// ═══════════════════════════════════════════════════════════════
const APP_VERSION = 'v1.0';
document.getElementById('appVersion').textContent = APP_VERSION;

// ═══════════════════════════════════════════════════════════════
//  CONFIGURACIÓN (mismo backend/API que copihue-raspadita.html)
// ═══════════════════════════════════════════════════════════════
const GAS_URL  = 'https://script.google.com/macros/s/AKfycbzWZzDvdGfW8vd2-FpQolT852cdPMeHbfKugn9DBOlju75bE1D0SUNB5EKEDOsI2vP4lA/exec';
const IMG_BASE = 'https://raw.githubusercontent.com/almacen-copihue/almacen-copihue/main/imagenes-productos/';
const PARES    = 8; // 8 pares = 16 cartas

let deck = [], flipped = [], matched = 0, moves = 0, lock = false;
let timer = null, seconds = 0;

function toSlug(nombre) {
  return nombre
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/ñ/g, 'n')
    .replace(/[^a-z0-9\s-]/g, '')
    .trim()
    .replace(/\s+/g, '-');
}
function imgUrl(nombre) { return IMG_BASE + toSlug(nombre) + '.jpg'; }

async function fetchGAS(action, data) {
  let url = GAS_URL + '?action=' + action;
  if (data) url += '&data=' + encodeURIComponent(JSON.stringify(data));
  const r = await fetch(url);
  return r.json();
}

function mostrarEstado(e, msg) {
  document.getElementById('stateLoading').style.display = e === 'loading' ? '' : 'none';
  document.getElementById('stateError').style.display   = e === 'error'   ? '' : 'none';
  document.getElementById('board').style.display         = e === 'juego'   ? 'grid' : 'none';
  if (msg) document.getElementById('errorMsg').textContent = msg;
}

async function iniciar() {
  mostrarEstado('loading');
  document.getElementById('win').classList.remove('show');
  try {
    const [resCfg, resPremios] = await Promise.all([
      fetchGAS('getConfigRaspadita'),
      fetchGAS('premiosRaspadita')
    ]);
    if (resCfg.ok && resCfg.config) {
      if (resCfg.config.empresa) document.getElementById('storeName').textContent = resCfg.config.empresa;
    }
    if (!resPremios.ok || !resPremios.premios || resPremios.premios.length < PARES) {
      mostrarEstado('error', 'No hay suficientes productos cargados hoy.');
      return;
    }
    const shuffled = shuffle([...resPremios.premios]);
    const chosen = shuffled.slice(0, PARES);
    startGame(chosen);
  } catch (err) {
    mostrarEstado('error', 'Error de conexión. Verificá tu internet.');
    console.error(err);
  }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startGame(productos) {
  clearInterval(timer);
  seconds = 0; moves = 0; matched = 0; flipped = []; lock = false;
  document.getElementById('moves').textContent = '0';
  document.getElementById('pairs').textContent = `0/${PARES}`;
  document.getElementById('time').textContent = '00:00';
  document.getElementById('win').classList.remove('show');
  mostrarEstado('juego');

  deck = shuffle([...productos, ...productos]);

  const board = document.getElementById('board');
  board.innerHTML = '';
  deck.forEach((prod, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.index = i;
    card.dataset.nombre = prod.nombre;
    card.innerHTML = `
      <div class="card-inner">
        <div class="face back"></div>
        <div class="face front">
          <img src="${imgUrl(prod.nombre)}" alt="${prod.nombre}"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
          <span class="fallback-emoji" style="display:none">🛒</span>
          <span class="prod-label">${prod.nombre}</span>
        </div>
      </div>`;
    card.addEventListener('click', () => flipCard(card));
    board.appendChild(card);
  });

  timer = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    document.getElementById('time').textContent = `${m}:${s}`;
  }, 1000);
}

function flipCard(card) {
  if (lock) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
  if (flipped.length === 2) return;

  card.classList.add('flipped');
  flipped.push(card);

  if (flipped.length === 2) {
    moves++;
    document.getElementById('moves').textContent = moves;
    lock = true;
    const [a, b] = flipped;
    if (a.dataset.nombre === b.dataset.nombre) {
      setTimeout(() => {
        a.classList.add('matched');
        b.classList.add('matched');
        matched++;
        document.getElementById('pairs').textContent = `${matched}/${PARES}`;
        flipped = [];
        lock = false;
        if (matched === PARES) endGame();
      }, 350);
    } else {
      setTimeout(() => {
        a.classList.remove('flipped');
        b.classList.remove('flipped');
        flipped = [];
        lock = false;
      }, 800);
    }
  }
}

function endGame() {
  clearInterval(timer);
  const m = String(Math.floor(seconds / 60)).padStart(2, '0');
  const s = String(seconds % 60).padStart(2, '0');
  document.getElementById('winText').textContent =
    `Lo lograste en ${moves} movimientos y ${m}:${s} minutos.`;
  document.getElementById('win').classList.add('show');
}

iniciar();
</script>
</body>
</html>
