<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>📦 Multicompra · Copihue</title>
<style>
  :root{
    --ink:#1c1b1f;
    --ink-soft:#6b6873;
    --line:#e4e1ea;
    --bg:#faf9f7;
    --surface:#ffffff;
    --violet:#7c3aed;
    --violet-deep:#5b21b6;
    --violet-tint:#f3eeff;
    --violet-tint-2:#ece3ff;
    --danger:#dc2626;
    --danger-tint:#fdecec;
    --ok:#16a34a;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:16px 16px 12px;
  }
  .titlebar{
    display:flex; align-items:baseline; justify-content:space-between; gap:8px;
    margin-bottom:12px;
  }
  h1{
    font-size:19px; font-weight:700; margin:0; letter-spacing:-0.01em;
    display:flex; align-items:center; gap:8px;
  }
  h1 .dot{
    width:8px; height:8px; border-radius:50%; background:var(--violet);
    display:inline-block;
  }
  .version{
    font-size:11px; color:var(--ink-soft); font-variant-numeric:tabular-nums;
  }
  .searchrow{ display:flex; gap:8px; }
  input[type="search"]{
    flex:1;
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:10px;
    padding:10px 12px;
    font-size:15px;
    color:var(--ink);
  }
  input[type="search"]:focus{ outline:2px solid var(--violet); outline-offset:-1px; }
  .refresh-btn{
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:10px;
    width:42px;
    font-size:16px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .refresh-btn:active{ background:var(--violet-tint); }
  .count{
    font-size:12.5px; color:var(--ink-soft); margin-top:10px;
  }

  main{ padding:14px 16px 80px; max-width:720px; margin:0 auto; }

  .state{
    text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:14.5px;
  }
  .state .big{ font-size:34px; margin-bottom:10px; }

  .cards{ display:flex; flex-direction:column; gap:10px; }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 14px 12px;
    transition:border-color .15s;
  }
  .card.dirty{ border-color:var(--violet); }

  .card-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    margin-bottom:10px;
  }
  .card-name{
    font-size:15px; font-weight:600; line-height:1.3;
  }
  .card-price{
    font-size:12.5px; color:var(--ink-soft); margin-top:2px;
  }
  .badge-grupo{
    font-size:11px; font-weight:600; color:var(--violet-deep);
    background:var(--violet-tint); border-radius:6px; padding:3px 7px;
    white-space:nowrap;
  }

  .segmented{
    display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden;
    width:fit-content; margin-bottom:10px;
  }
  .segmented button{
    border:none; background:var(--surface); padding:6px 12px; font-size:12.5px;
    font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .segmented button.active{ background:var(--violet); color:#fff; }
  .segmented button:not(:last-child){ border-right:1px solid var(--line); }

  .field-row{ display:flex; gap:8px; margin-bottom:8px; }
  .field{ flex:1; }
  .field label{
    display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px;
    font-weight:600;
  }
  .field input{
    width:100%;
    border:1px solid var(--line);
    border-radius:9px;
    padding:9px 10px;
    font-size:15px;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .field input:focus{ outline:2px solid var(--violet); outline-offset:-1px; }
  .field.grupo{ display:none; }
  .field.grupo.show{ display:block; }

  .card-actions{
    display:flex; align-items:center; gap:8px; margin-top:10px;
  }
  .btn{
    border:none; border-radius:9px; padding:9px 14px; font-size:13.5px;
    font-weight:600; cursor:pointer;
  }
  .btn-save{ background:var(--violet); color:#fff; flex:1; }
  .btn-save:disabled{ background:var(--violet-tint-2); color:var(--violet-deep); opacity:.6; }
  .btn-off{ background:var(--danger-tint); color:var(--danger); }
  .save-feedback{
    font-size:12px; color:var(--ok); font-weight:600; white-space:nowrap;
  }
  .save-feedback.err{ color:var(--danger); }

  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; font-size:13.5px; font-weight:500;
    padding:11px 18px; border-radius:10px; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; z-index:50; max-width:88vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (min-width:640px){
    .cards{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  }
</style>
</head>
<body>

<header>
  <div class="titlebar">
    <h1><span class="dot"></span>Multicompra</h1>
    <span class="version" id="versionTag">v1.0</span>
  </div>
  <div class="searchrow">
    <input type="search" id="buscador" placeholder="Buscar producto…" autocomplete="off">
    <button class="refresh-btn" id="btnRefresh" title="Actualizar">⟳</button>
  </div>
  <div class="count" id="contador"></div>
</header>

<main>
  <div id="estado" class="state">
    <div class="big">📦</div>
    Cargando ofertas de multicompra…
  </div>
  <div class="cards" id="lista"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const VERSION = '1.0';
document.getElementById('versionTag').textContent = 'v' + VERSION;

const API_URL = 'https://script.google.com/macros/s/AKfycbzWZzDvdGfW8vd2-FpQolT852cdPMeHbfKugn9DBOlju75bE1D0SUNB5EKEDOsI2vP4lA/exec';

let items = [];       // datos crudos del backend
let dirty = {};        // id -> {tipo,cantidad,precio,grupo} valores editados sin guardar

const $lista    = document.getElementById('lista');
const $estado   = document.getElementById('estado');
const $contador = document.getElementById('contador');
const $buscador = document.getElementById('buscador');
const $toast    = document.getElementById('toast');

function showToast(msg, isErr){
  $toast.textContent = msg;
  $toast.style.background = isErr ? '#dc2626' : '#1c1b1f';
  $toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> $toast.classList.remove('show'), 2600);
}

function money(n){
  return '$' + (Number(n)||0).toLocaleString('es-CL');
}

async function cargar(){
  $estado.style.display = 'block';
  $estado.innerHTML = '<div class="big">📦</div>Cargando ofertas de multicompra…';
  $lista.innerHTML = '';
  try{
    const r = await fetch(API_URL + '?action=getMulticompraTodas&t=' + Date.now(), { redirect:'follow' });
    const data = await r.json();
    if(!data.ok){
      $estado.innerHTML = '<div class="big">⚠️</div>' + (data.error || 'No se pudo cargar.');
      return;
    }
    items = data.items || [];
    dirty = {};
    render();
  }catch(e){
    $estado.innerHTML = '<div class="big">⚠️</div>Sin conexión con el backend.<br><span style="font-size:12px">' + e.message + '</span>';
  }
}

function render(){
  const filtro = $buscador.value.trim().toUpperCase();
  const filtrados = items.filter(p => !filtro || p.nombre.toUpperCase().includes(filtro));

  $contador.textContent = items.length
    ? filtrados.length + ' de ' + items.length + ' con multicompra activa'
    : '';

  if(!items.length){
    $estado.style.display = 'block';
    $estado.innerHTML = '<div class="big">🗂️</div>No hay productos con multicompra activa en este momento.';
    $lista.innerHTML = '';
    return;
  }
  if(!filtrados.length){
    $estado.style.display = 'block';
    $estado.innerHTML = '<div class="big">🔍</div>Sin resultados para "' + $buscador.value + '".';
    $lista.innerHTML = '';
    return;
  }

  $estado.style.display = 'none';
  $lista.innerHTML = filtrados.map(cardHTML).join('');

  filtrados.forEach(p => wireCard(p));
}

function cardHTML(p){
  const d = dirty[p.id] || {};
  const tipo     = (d.tipo     !== undefined ? d.tipo     : p.tipo)     || 'INDIVIDUAL';
  const cantidad = (d.cantidad !== undefined ? d.cantidad : p.cantidad) || '';
  const precio   = (d.precio   !== undefined ? d.precio   : p.precioPack) || '';
  const grupo    = (d.grupo    !== undefined ? d.grupo    : p.grupo)    || '';
  const esGrupal = tipo === 'GRUPAL';

  return `
  <div class="card" data-id="${p.id}">
    <div class="card-top">
      <div>
        <div class="card-name">${p.nombre}</div>
        <div class="card-price">Normal: ${money(p.precioNormal)} · stock ${p.stock}</div>
      </div>
      ${p.grupo ? `<span class="badge-grupo">${p.grupo}</span>` : ''}
    </div>

    <div class="segmented" data-role="tipo">
      <button type="button" data-val="INDIVIDUAL" class="${!esGrupal ? 'active' : ''}">Individual</button>
      <button type="button" data-val="GRUPAL" class="${esGrupal ? 'active' : ''}">Grupal</button>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Cantidad</label>
        <input type="number" inputmode="numeric" data-role="cantidad" value="${cantidad}" min="0">
      </div>
      <div class="field">
        <label>Precio pack</label>
        <input type="number" inputmode="numeric" data-role="precio" value="${precio}" min="0">
      </div>
    </div>

    <div class="field grupo ${esGrupal ? 'show' : ''}" data-role="campoGrupo">
      <label>Grupo (productos intercambiables)</label>
      <input type="text" data-role="grupo" value="${grupo}" placeholder="ej: BEBIDAS-2L">
    </div>

    <div class="card-actions">
      <button class="btn btn-save" data-role="guardar">Guardar</button>
      <button class="btn btn-off" data-role="desactivar">Desactivar</button>
      <span class="save-feedback" data-role="feedback"></span>
    </div>
  </div>`;
}

function wireCard(p){
  const el = $lista.querySelector('.card[data-id="' + p.id + '"]');
  if(!el) return;

  const markDirty = () => {
    el.classList.add('dirty');
    if(!dirty[p.id]) dirty[p.id] = {};
  };

  el.querySelectorAll('[data-role="tipo"] button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      el.querySelectorAll('[data-role="tipo"] button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      markDirty();
      dirty[p.id].tipo = btn.dataset.val;
      const grupoField = el.querySelector('[data-role="campoGrupo"]');
      grupoField.classList.toggle('show', btn.dataset.val === 'GRUPAL');
    });
  });

  el.querySelector('[data-role="cantidad"]').addEventListener('input', e=>{
    markDirty(); dirty[p.id].cantidad = e.target.value;
  });
  el.querySelector('[data-role="precio"]').addEventListener('input', e=>{
    markDirty(); dirty[p.id].precio = e.target.value;
  });
  el.querySelector('[data-role="grupo"]').addEventListener('input', e=>{
    markDirty(); dirty[p.id].grupo = e.target.value;
  });

  el.querySelector('[data-role="guardar"]').addEventListener('click', ()=> guardar(p, el));
  el.querySelector('[data-role="desactivar"]').addEventListener('click', ()=> desactivar(p, el));
}

async function guardar(p, el){
  const btn = el.querySelector('[data-role="guardar"]');
  const feedback = el.querySelector('[data-role="feedback"]');
  const tipoActivo = el.querySelector('[data-role="tipo"] button.active').dataset.val;
  const payload = {
    id: p.id,
    activa: true,
    tipo: tipoActivo,
    cantidad: el.querySelector('[data-role="cantidad"]').value,
    precio: el.querySelector('[data-role="precio"]').value,
    grupo: el.querySelector('[data-role="grupo"]').value
  };
  btn.disabled = true; btn.textContent = 'Guardando…';
  feedback.textContent = ''; feedback.classList.remove('err');
  try{
    const url = API_URL + '?action=guardarMulticompra&data=' + encodeURIComponent(JSON.stringify(payload));
    const r = await fetch(url, { redirect:'follow' });
    const data = await r.json();
    if(data.success){
      Object.assign(p, {
        tipo: payload.tipo,
        cantidad: Number(payload.cantidad)||0,
        precioPack: Number(payload.precio)||0,
        grupo: payload.grupo
      });
      delete dirty[p.id];
      el.classList.remove('dirty');
      feedback.textContent = '✓ Guardado';
      showToast('Multicompra actualizada: ' + p.nombre);
    }else{
      feedback.textContent = data.mensaje || 'Error';
      feedback.classList.add('err');
      showToast(data.mensaje || 'No se pudo guardar', true);
    }
  }catch(e){
    feedback.textContent = 'Sin conexión';
    feedback.classList.add('err');
    showToast('Sin conexión con el backend', true);
  }
  btn.disabled = false; btn.textContent = 'Guardar';
}

async function desactivar(p, el){
  if(!confirm('¿Desactivar multicompra de "' + p.nombre + '"?')) return;
  const btn = el.querySelector('[data-role="desactivar"]');
  btn.disabled = true; btn.textContent = '…';
  try{
    const payload = { id: p.id, activa: false };
    const url = API_URL + '?action=guardarMulticompra&data=' + encodeURIComponent(JSON.stringify(payload));
    const r = await fetch(url, { redirect:'follow' });
    const data = await r.json();
    if(data.success){
      items = items.filter(x => x.id !== p.id);
      delete dirty[p.id];
      showToast('Desactivada: ' + p.nombre);
      render();
    }else{
      showToast(data.mensaje || 'No se pudo desactivar', true);
      btn.disabled = false; btn.textContent = 'Desactivar';
    }
  }catch(e){
    showToast('Sin conexión con el backend', true);
    btn.disabled = false; btn.textContent = 'Desactivar';
  }
}

$buscador.addEventListener('input', render);
document.getElementById('btnRefresh').addEventListener('click', cargar);

cargar();
</script>

</body>
</html>
