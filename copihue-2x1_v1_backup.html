<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎯 2×1 · Copihue</title>
<!-- APP_VERSION se inyecta en el <title> y en el badge del header vía JS, ver Regla de Oro 1 -->
<meta name="theme-color" content="#991b1b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --verde: #991b1b;
    --verde-claro: #ef4444;
    --verde-oscuro: #7f1d1d;
    --naranja: #ff6f00;
    --rojo: #d32f2f;
    --gris: #f5f5f5;
    --texto: #212121;
    --subtexto: #757575;
    --header-bg-1: #7f1d1d;
    --header-bg-2: #991b1b;
    --ok: #2e7d32;
    --ok-bg: #e8f5e9;
    --warn: #e65100;
    --warn-bg: #fff3e0;
    --bad: #c62828;
    --bad-bg: #ffebee;
  }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f0f4f0;
    color: var(--texto);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, var(--header-bg-1), var(--header-bg-2));
    color: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .header-titulo { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .header-version {
    font-size: 0.65rem; font-weight: 700; opacity: 0.75;
    background: rgba(255,255,255,0.18); padding: 2px 7px; border-radius: 8px;
  }
  .header-guardado {
    font-size: 1.1rem; opacity: 0; transition: opacity 0.2s; margin-left: 2px;
  }
  .header-guardado.visible { opacity: 1; }
  .indicador-carga {
    width: 10px; height: 10px; border-radius: 50%;
    background: #ff5252; flex-shrink: 0; transition: background 0.5s ease;
  }
  .indicador-carga.ok { background: #69f0ae; }
  .indicador-carga.cargando { background: #ffb300; animation: parpadeo 0.8s ease-in-out infinite; }
  @keyframes parpadeo { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .buscador {
    padding: 12px 14px;
    background: white;
    border-bottom: 1px solid #eee;
    flex-shrink: 0;
  }
  .buscador input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
  }
  .buscador input:focus { border-color: var(--verde); }

  .lista {
    flex: 1;
    overflow-y: auto;
    background: white;
  }
  .lista-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
  }
  .lista-item, .lista-item * { cursor: pointer; }
  .lista-item:hover { background: #fafafa; }
  .lista-item:active { background: #f0f0f0; }
  .lista-item.tiene-2x1 { background: var(--ok-bg); }
  .lista-item.tiene-2x1:hover { background: #dcf0dd; }
  .li-nombre { flex: 1; font-size: 0.92rem; font-weight: 600; }
  .li-precio { font-size: 0.9rem; color: var(--subtexto); font-weight: 700; }
  .li-foto {
    width: 40px; height: 40px; border-radius: 8px; object-fit: cover;
    flex-shrink: 0; background: var(--gris); border: 1px solid #eee;
  }
  .li-foto-placeholder {
    width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0;
    background: var(--gris); border: 1px solid #eee;
    display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
  }
  .li-badge {
    font-size: 0.65rem; font-weight: 800; color: white; background: var(--ok);
    padding: 2px 7px; border-radius: 10px; flex-shrink:0;
  }
  .vacio { text-align:center; padding: 40px 20px; color: var(--subtexto); font-size:0.9rem; }

  /* ===== MODAL PRODUCTO ===== */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .overlay.open { display: flex; }
  .panel {
    background: white; width: 100%; max-width: 480px;
    border-radius: 18px 18px 0 0; padding: 20px;
    max-height: 92dvh; overflow-y: auto;
  }
  .panel-header { display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px; }
  .panel-titulo { font-size: 1.05rem; font-weight: 800; }
  .panel-cerrar {
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: var(--gris); font-size: 1.1rem; cursor: pointer;
  }

  .banner-borrador {
    background: var(--warn-bg); color: var(--warn); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 12px; font-size: 0.82rem; display: none;
  }
  .banner-borrador.visible { display: block; }
  .banner-borrador .btns-borrador { display:flex; gap: 8px; margin-top: 8px; }
  .banner-borrador button {
    flex:1; border:none; border-radius: 8px; padding: 8px; font-size: 0.8rem;
    font-weight: 700; cursor: pointer;
  }
  .banner-borrador .btn-recuperar { background: var(--naranja); color: white; }
  .banner-borrador .btn-descartar { background: white; color: var(--warn); border: 1px solid var(--warn) !important; }

  .panel-foto-wrap {
    width: 100%; height: 160px; border-radius: 12px; margin-bottom: 14px;
    background: var(--gris); border: 1px solid #eee; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .panel-foto-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .panel-foto-wrap .sin-foto { font-size: 2.2rem; opacity: 0.4; }

  .fila-precio { display:flex; gap:10px; margin-bottom: 12px; }
  .caja-dato {
    flex:1; background: var(--gris); border-radius: 10px; padding: 10px; text-align:center;
  }
  .caja-dato .lbl { font-size: 0.68rem; color: var(--subtexto); font-weight:700; text-transform:uppercase; }
  .caja-dato .val { font-size: 1.1rem; font-weight: 800; margin-top: 2px; }

  .promo-preview {
    background: linear-gradient(135deg, var(--header-bg-1), var(--header-bg-2));
    color: white; border-radius: 12px; padding: 16px; text-align:center; margin-bottom: 14px;
  }
  .promo-preview .titulo { font-size: 1rem; font-weight: 800; margin-bottom: 6px; }
  .promo-preview .precios { display:flex; align-items:baseline; justify-content:center; gap: 10px; }
  .promo-preview .antes { font-size: 1rem; text-decoration: line-through; opacity: 0.75; }
  .promo-preview .ahora { font-size: 1.6rem; font-weight: 900; }
  .promo-preview .sub { font-size: 0.75rem; opacity: 0.85; margin-top: 4px; }

  .margen-box {
    border-radius: 10px; padding: 12px; margin-bottom: 14px; font-size: 0.85rem; font-weight: 700;
  }
  .margen-box.ok { background: var(--ok-bg); color: var(--ok); }
  .margen-box.warn { background: var(--warn-bg); color: var(--warn); }
  .margen-box.bad { background: var(--bad-bg); color: var(--bad); }
  .margen-box .chico { display:block; font-weight:500; font-size:0.78rem; margin-top:2px; }

  label.lbl-campo { font-size: 0.78rem; font-weight:700; color: var(--subtexto); display:block; margin-bottom: 4px; }
  .input-texto {
    width: 100%; padding: 10px 12px; border: 2px solid #e0e0e0; border-radius: 10px;
    font-size: 0.95rem; margin-bottom: 14px; outline:none;
  }
  .input-texto:focus { border-color: var(--verde); }

  .btns { display:flex; gap: 10px; }
  .btn {
    flex:1; border:none; border-radius: 12px; padding: 14px; font-size: 0.95rem;
    font-weight: 800; cursor: pointer;
  }
  .btn-activar { background: var(--naranja); color: white; }
  .btn-activar:disabled { background: #bdbdbd; }
  .btn-quitar { background: var(--bad-bg); color: var(--bad); }
  .btn.is-busy { opacity: 0.6; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #212121; color: white; padding: 12px 18px; border-radius: 10px;
    font-size: 0.88rem; z-index: 100; max-width: 90%; text-align:center;
    opacity: 0; transition: opacity 0.3s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

  <div class="header">
    <div class="header-titulo">
      🎯 2×1 Copihue
      <span class="header-version" id="headerVersion"></span>
      <span class="header-guardado" id="headerGuardado" title="Cambios sin guardar">💾</span>
      <div class="indicador-carga" id="indicadorCarga"></div>
    </div>
  </div>

  <div class="buscador">
    <input type="text" id="buscar" placeholder="🔍 Buscar producto..." autocomplete="off">
  </div>

  <div class="lista" id="lista">
    <div class="vacio">Cargando productos...</div>
  </div>

  <div class="overlay" id="overlay">
    <div class="panel">
      <div class="panel-header">
        <div class="panel-titulo" id="panelNombre">Producto</div>
        <button class="panel-cerrar" id="btnCerrar">✕</button>
      </div>

      <div class="banner-borrador" id="bannerBorrador">
        🛡️ Tenés un texto sin guardar de este producto.
        <div class="btns-borrador">
          <button class="btn-recuperar" id="btnRecuperarBorrador">Recuperar</button>
          <button class="btn-descartar" id="btnDescartarBorrador">Descartar</button>
        </div>
      </div>

      <div class="panel-foto-wrap" id="panelFotoWrap">
        <span class="sin-foto">📦</span>
      </div>

      <div class="fila-precio">
        <div class="caja-dato">
          <div class="lbl">Precio venta</div>
          <div class="val" id="datoPrecio">$0</div>
        </div>
        <div class="caja-dato">
          <div class="lbl">Costo</div>
          <div class="val" id="datoCosto">$0</div>
        </div>
        <div class="caja-dato">
          <div class="lbl">Stock</div>
          <div class="val" id="datoStock">0</div>
        </div>
      </div>

      <div class="promo-preview">
        <div class="titulo" id="previewTexto">🔥 2×1 HOY · Llevá 2 · Pagá 1</div>
        <div class="precios">
          <span class="antes" id="previewAntes">$0</span>
          <span class="ahora" id="previewAhora">$0</span>
        </div>
        <div class="sub">precio por unidad en el POS mientras dure la promo</div>
      </div>

      <div class="margen-box" id="margenBox">
        <span id="margenTexto">Calculando margen...</span>
        <span class="chico" id="margenChico"></span>
      </div>

      <label class="lbl-campo">Texto comercial (se guarda en la planilla)</label>
      <input type="text" class="input-texto" id="inputTexto" value="🔥 2×1 HOY · Llevá 2 · Pagá 1">

      <div class="btns">
        <button class="btn btn-quitar" id="btnQuitar" style="display:none;">🗑️ Quitar 2×1</button>
        <button class="btn btn-activar" id="btnActivar">✅ Activar 2×1</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
// ===== Regla de Oro 1: versionado =====
const APP_VERSION = 1;
document.title = `🎯 2×1 · Copihue v${APP_VERSION}`;
document.getElementById('headerVersion').textContent = `v${APP_VERSION}`;

const API_URL = 'https://script.google.com/macros/s/AKfycbzWZzDvdGfW8vd2-FpQolT852cdPMeHbfKugn9DBOlju75bE1D0SUNB5EKEDOsI2vP4lA/exec';
const DRAFT_KEY_PREFIX = 'copihue2x1_draft_';

let productos = [];
let seleccionado = null;
let textoOriginal = '';   // valor cargado al abrir el panel, para detectar cambios
let hayPendiente = false; // Regla 4/12: hay edición sin guardar

// ===== Regla de Oro 4: icono de guardado pendiente =====
function marcarPendiente(valor) {
  hayPendiente = valor;
  document.getElementById('headerGuardado').classList.toggle('visible', valor);
}

// ===== Regla de Oro 12: respaldo automático en localStorage =====
let draftTimer = null;
function guardarBorrador(p, texto) {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => {
    try {
      localStorage.setItem(DRAFT_KEY_PREFIX + p.id, JSON.stringify({ texto, ts: Date.now() }));
    } catch (e) { /* localStorage no disponible, no es crítico */ }
  }, 500);
}
function leerBorrador(p) {
  try {
    const raw = localStorage.getItem(DRAFT_KEY_PREFIX + p.id);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function borrarBorrador(p) {
  try { localStorage.removeItem(DRAFT_KEY_PREFIX + p.id); } catch (e) {}
}

// ===== Regla de Oro 3: no abandonar la página sin confirmar =====
window.addEventListener('beforeunload', (e) => {
  if (hayPendiente) { e.preventDefault(); e.returnValue = ''; }
});
history.pushState({ copihue2x1: true }, '', location.href);
window.addEventListener('popstate', () => {
  if (hayPendiente) {
    const salir = confirm('Tenés un texto de 2×1 sin guardar. ¿Salir igual?');
    if (!salir) { history.pushState({ copihue2x1: true }, '', location.href); return; }
  }
  history.pushState({ copihue2x1: true }, '', location.href);
});

function slugFoto(nombre) {
  return String(nombre).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9 ]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-')
    .trim();
}
function getImgUrl(p) {
  if (p.foto && p.foto.startsWith('http')) return p.foto;
  return `imagenes-productos/${slugFoto(p.nombre)}.jpg`;
}

function fmt(n) {
  return '$' + Math.round(n || 0).toLocaleString('es-AR');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2600);
}

function parseProducts(data) {
  let rows = null;
  if (Array.isArray(data)) rows = data;
  else if (data && typeof data === 'object') {
    for (const k of Object.keys(data)) {
      if (Array.isArray(data[k]) && data[k].length > 0) { rows = data[k]; break; }
    }
  }
  if (!Array.isArray(rows)) return [];
  return rows
    .filter(r => r && typeof r === 'object')
    .map((r, i) => {
      const nombre = String(r.name || r.nombre || '').trim();
      const precioVenta = parseFloat(r.price || r.precio || 0);
      const costo = parseFloat(r.precioCosto || r.costo || r.cost || 0);
      const stock = parseFloat(r.stock ?? 0);
      const id = Number(r.id) || (nombre + '_' + i);
      const foto = String(r.image || r.imagen || r.foto || '').trim();
      const ofertaSimpleServer = r.ofertaSimple || null;
      return { id, nombre, precioVenta, costo, stock, foto, ofertaSimpleServer };
    })
    .filter(p => p.nombre && p.precioVenta > 0);
}

async function cargarProductos() {
  const ind = document.getElementById('indicadorCarga');
  ind.classList.add('cargando');
  try {
    const r = await fetch(API_URL + '?cache=' + Date.now(), { redirect: 'follow', signal: AbortSignal.timeout(25000) });
    const data = await r.json();
    productos = parseProducts(data);
    ind.classList.remove('cargando');
    ind.classList.add('ok');
    renderLista('');
  } catch (e) {
    ind.classList.remove('cargando');
    document.getElementById('lista').innerHTML = '<div class="vacio">❌ Error al cargar productos.<br>Revisá la conexión y volvé a abrir la app.</div>';
    console.error(e);
  }
}

function esTiene2x1(p) {
  return !!(p.ofertaSimpleServer && p.ofertaSimpleServer.activa);
}

function renderLista(filtro) {
  const lista = document.getElementById('lista');
  const term = (filtro || '').toLowerCase().trim();
  let filtrados = productos;
  if (term) {
    filtrados = productos.filter(p => p.nombre.toLowerCase().includes(term));
  } else {
    // sin búsqueda: mostrar primero los que ya tienen 2x1 activo, después el resto (máx 60 para no colgar el render)
    filtrados = [...productos].sort((a, b) => esTiene2x1(b) - esTiene2x1(a));
  }
  filtrados = filtrados.slice(0, 80);

  if (!filtrados.length) {
    lista.innerHTML = '<div class="vacio">Sin resultados</div>';
    return;
  }
  lista.innerHTML = filtrados.map(p => `
    <div class="lista-item ${esTiene2x1(p) ? 'tiene-2x1' : ''}" data-id="${p.id}">
      <img class="li-foto" src="${getImgUrl(p)}" loading="lazy"
           onerror="this.outerHTML='<div class=&quot;li-foto-placeholder&quot;>📦</div>'">
      <div class="li-nombre">${p.nombre}</div>
      ${esTiene2x1(p) ? '<span class="li-badge">2×1</span>' : ''}
      <div class="li-precio">${fmt(p.precioVenta)}</div>
    </div>
  `).join('');
}

document.getElementById('buscar').addEventListener('input', e => renderLista(e.target.value));

document.getElementById('lista').addEventListener('click', e => {
  const item = e.target.closest('.lista-item');
  if (!item) return;
  const id = item.dataset.id;
  const p = productos.find(pp => String(pp.id) === String(id));
  if (p) abrirPanel(p);
});

function abrirPanel(p) {
  seleccionado = p;
  document.getElementById('panelNombre').textContent = p.nombre;
  document.getElementById('datoPrecio').textContent = fmt(p.precioVenta);
  document.getElementById('datoCosto').textContent = p.costo > 0 ? fmt(p.costo) : '—';
  document.getElementById('datoStock').textContent = Math.round(p.stock);

  const fotoWrap = document.getElementById('panelFotoWrap');
  const url = getImgUrl(p);
  fotoWrap.innerHTML = `<img src="${url}" onerror="this.parentElement.innerHTML='<span class=&quot;sin-foto&quot;>📦</span>'">`;

  const yaActivo = esTiene2x1(p);
  textoOriginal = yaActivo && p.ofertaSimpleServer.texto ? p.ofertaSimpleServer.texto : '🔥 2×1 HOY · Llevá 2 · Pagá 1';
  document.getElementById('inputTexto').value = textoOriginal;
  document.getElementById('btnQuitar').style.display = yaActivo ? 'block' : 'none';
  document.getElementById('btnActivar').textContent = yaActivo ? '🔄 Actualizar 2×1' : '✅ Activar 2×1';
  marcarPendiente(false);

  // Regla de Oro 12: ¿hay un borrador local más nuevo que lo que vino del servidor?
  const banner = document.getElementById('bannerBorrador');
  const borrador = leerBorrador(p);
  if (borrador && borrador.texto && borrador.texto !== textoOriginal) {
    banner.classList.add('visible');
    document.getElementById('btnRecuperarBorrador').onclick = () => {
      document.getElementById('inputTexto').value = borrador.texto;
      actualizarPreview();
      marcarPendiente(true);
      banner.classList.remove('visible');
    };
    document.getElementById('btnDescartarBorrador').onclick = () => {
      borrarBorrador(p);
      banner.classList.remove('visible');
    };
  } else {
    banner.classList.remove('visible');
  }

  actualizarPreview();
  document.getElementById('inputTexto').oninput = () => {
    actualizarPreview();
    const val = document.getElementById('inputTexto').value;
    marcarPendiente(val !== textoOriginal);
    guardarBorrador(p, val);
  };
  document.getElementById('overlay').classList.add('open');
}

function actualizarPreview() {
  const p = seleccionado;
  if (!p) return;
  const precioUnitPromo = Math.round(p.precioVenta / 2);
  document.getElementById('previewTexto').textContent = document.getElementById('inputTexto').value || '2×1';
  document.getElementById('previewAntes').textContent = fmt(p.precioVenta);
  document.getElementById('previewAhora').textContent = fmt(precioUnitPromo);

  const margenBox = document.getElementById('margenBox');
  const margenTexto = document.getElementById('margenTexto');
  const margenChico = document.getElementById('margenChico');

  if (!(p.costo > 0)) {
    margenBox.className = 'margen-box warn';
    margenTexto.textContent = '⚠️ Sin costo cargado';
    margenChico.textContent = 'No puedo calcular si conviene. Revisá el costo en la planilla antes de activar.';
    return;
  }
  const costoDos = p.costo * 2;
  const ganancia = p.precioVenta - costoDos;
  const pctSobreVenta = (ganancia / p.precioVenta) * 100;

  if (ganancia > 0) {
    margenBox.className = 'margen-box ok';
    margenTexto.textContent = `✅ Ganás ${fmt(ganancia)} por cada 2 unidades`;
  } else if (ganancia === 0) {
    margenBox.className = 'margen-box warn';
    margenTexto.textContent = `⚠️ Vendés justo al costo`;
  } else {
    margenBox.className = 'margen-box bad';
    margenTexto.textContent = `🔴 Perdés ${fmt(Math.abs(ganancia))} por cada 2 unidades`;
  }
  margenChico.textContent = `Costo real de 2 unidades: ${fmt(costoDos)} · Margen sobre venta: ${pctSobreVenta.toFixed(1)}%`;
}

document.getElementById('btnCerrar').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('open');
  marcarPendiente(false);
  seleccionado = null;
});

async function apiAction(action, datos) {
  try {
    const url = API_URL + '?action=' + action + '&data=' + encodeURIComponent(JSON.stringify(datos)) + '&t=' + Date.now();
    const r = await fetch(url, { redirect: 'follow' });
    return await r.json();
  } catch (e) {
    console.error('apiAction error', action, e);
    return { success: false, mensaje: 'Error de red' };
  }
}

document.getElementById('btnActivar').addEventListener('click', async () => {
  const p = seleccionado;
  if (!p) return;
  const texto = (document.getElementById('inputTexto').value || '').trim();
  if (!texto) { toast('⚠️ Escribí un texto para la oferta'); return; }
  const precioUnitPromo = Math.round(p.precioVenta / 2);

  const btn = document.getElementById('btnActivar');
  btn.classList.add('is-busy');
  btn.disabled = true;
  btn.textContent = '⏳ Guardando...';
  toast(`⏳ Activando 2×1 en "${p.nombre}"...`);

  const res = await apiAction('ofertaSimple', { items: [{ id: p.id, precio: precioUnitPromo }], texto });

  btn.classList.remove('is-busy');
  btn.disabled = false;
  btn.textContent = '✅ Activar 2×1';

  if (res && res.success) {
    toast(`🎯 2×1 activado en "${p.nombre}"`);
    p.ofertaSimpleServer = { activa: true, precio: precioUnitPromo, texto };
    borrarBorrador(p);
    marcarPendiente(false);
    document.getElementById('overlay').classList.remove('open');
    renderLista(document.getElementById('buscar').value);
  } else {
    toast(`❌ ${res && res.mensaje ? res.mensaje : 'No se pudo guardar'}`);
  }
});

document.getElementById('btnQuitar').addEventListener('click', async () => {
  const p = seleccionado;
  if (!p) return;
  const btn = document.getElementById('btnQuitar');
  btn.classList.add('is-busy');
  btn.disabled = true;
  btn.textContent = '⏳ Quitando...';

  const res = await apiAction('quitarOfertaSimple', { productoIds: [p.id] });

  btn.classList.remove('is-busy');
  btn.disabled = false;
  btn.textContent = '🗑️ Quitar 2×1';

  if (res && res.success) {
    toast(`🗑️ 2×1 quitado de "${p.nombre}"`);
    p.ofertaSimpleServer = null;
    borrarBorrador(p);
    marcarPendiente(false);
    document.getElementById('overlay').classList.remove('open');
    renderLista(document.getElementById('buscar').value);
  } else {
    toast(`❌ ${res && res.mensaje ? res.mensaje : 'No se pudo quitar'}`);
  }
});

cargarProductos();
</script>
</body>
</html>
