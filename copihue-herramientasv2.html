<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Herramientas · Copihue v2.0</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0e0e1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    #header {
      background: linear-gradient(135deg, #c0392b, #8e1a12);
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    #header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #header h1 {
      font-size: 0.92rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.3px;
    }
    #header-sub {
      font-size: 0.66rem;
      color: rgba(255,255,255,0.6);
      margin-top: 1px;
    }
    #btn-back {
      background: rgba(255,255,255,0.15);
      border: none;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      color: #fff;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      flex-shrink: 0;
    }
    #btn-back:hover { background: rgba(255,255,255,0.25); }

    /* ── SEARCH ── */
    #search-wrap {
      padding: 10px 12px 6px;
      flex-shrink: 0;
    }
    #searchInput {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 8px 12px;
      color: #fff;
      font-size: 0.82rem;
      outline: none;
    }
    #searchInput::placeholder { color: rgba(255,255,255,0.35); }
    #searchInput:focus { border-color: rgba(192,57,43,0.6); }

    /* ── CONTENT ── */
    #content {
      padding: 8px 12px 20px;
      flex: 1;
    }

    .sec-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.4);
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      margin: 14px 2px 8px;
    }
    .sec-title:first-child { margin-top: 2px; }
    .sec-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }
    .sec-count {
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 1px 7px;
      font-size: 0.62rem;
    }

    /* ── GRID: CORRECTAS ── */
    #grid-ok {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .h-card {
      background: rgba(61,214,140,0.06);
      border: 1px solid rgba(61,214,140,0.18);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: background 0.15s, transform 0.12s;
      min-height: 84px;
      justify-content: center;
      position: relative;
    }
    .h-card:hover  { background: rgba(61,214,140,0.13); transform: translateY(-1px); }
    .h-card:active { transform: scale(0.97); }
    .h-card.sin-link { cursor: default; opacity: 0.75; }
    .h-card-badge {
      background: rgba(61,214,140,0.16);
      color: #6bebae;
      font-size: 0.5rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      border-radius: 5px;
      padding: 2px 5px;
      line-height: 1.3;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .h-card-nom  { color: #fff; font-size: 0.68rem; font-weight: 800; line-height: 1.2; }
    .h-card-ver  { color: #6bebae; font-size: 0.56rem; font-weight: 700; }
    .h-card-nolink {
      position: absolute;
      top: 5px;
      right: 6px;
      font-size: 0.6rem;
      opacity: 0.5;
    }

    /* ── LISTA: EN TRABAJO / PENDIENTES ── */
    #list-otras {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .h-row {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-left: 3px solid #666;
      border-radius: 10px;
      padding: 9px 11px;
    }
    .h-row.est-trabajando { border-left-color: #f0a83c; }
    .h-row.est-esperar    { border-left-color: #5b8def; }
    .h-row.est-otro       { border-left-color: #666; }

    .h-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .h-row-nom {
      color: #fff;
      font-size: 0.76rem;
      font-weight: 700;
      line-height: 1.25;
    }
    .h-row-tags {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .tag {
      font-size: 0.56rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      border-radius: 20px;
      padding: 2px 7px;
      white-space: nowrap;
    }
    .tag-trabajando { background: rgba(240,168,60,0.18); color: #f0a83c; }
    .tag-esperar    { background: rgba(91,141,239,0.18); color: #7ea3f5; }
    .tag-otro       { background: rgba(255,255,255,0.08); color: #999; }
    .tag-ver        { background: rgba(255,255,255,0.07); color: #aaa; }
    .tag-vuelve     { background: rgba(255,255,255,0.07); color: #aaa; }

    .h-row-obs {
      color: #888;
      font-size: 0.66rem;
      line-height: 1.35;
      margin-top: 4px;
    }
    .h-row-meta {
      color: #555;
      font-size: 0.58rem;
      margin-top: 3px;
    }

    /* ── ESTADO (carga/error) ── */
    #estado {
      text-align: center;
      padding: 40px 16px;
      color: #555;
      font-size: 0.82rem;
    }
    #estado .ico { font-size: 2rem; margin-bottom: 8px; }
    #estado .tit { color: #e57373; font-weight: 700; }
    #estado .sub { color: #666; font-size: 0.72rem; margin-top: 4px; }

    /* ── FOOTER ── */
    #footer {
      padding: 8px 12px 16px;
      border-top: 1px solid rgba(255,255,255,0.07);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn-footer {
      flex: 1;
      padding: 9px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid;
    }
    #btn-reload {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.12);
      color: #aaa;
    }
    #btn-reload:hover { background: rgba(255,255,255,0.1); }
    #btn-reload:active { transform: scale(0.97); }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

    /* ── MOBILE ── */
    @media (max-width: 480px) {
      #grid-ok { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .h-card { padding: 8px 4px; min-height: 76px; }
    }
    @media (min-width: 768px) {
      body { max-width: 680px; margin: 0 auto; }
      #grid-ok { grid-template-columns: repeat(5, 1fr); }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div id="header">
    <div id="header-left">
      <span style="font-size:1.3rem;">🧰</span>
      <div>
        <h1>Herramientas Copihue</h1>
        <div id="header-sub">Cargando...</div>
      </div>
    </div>
    <a href="seba21.html" id="btn-back" title="Volver al panel">←</a>
  </div>

  <!-- SEARCH -->
  <div id="search-wrap">
    <input type="search" id="searchInput" placeholder="Buscar herramienta..." autocomplete="off">
  </div>

  <!-- CONTENT -->
  <div id="content">
    <div id="estado">
      <div class="ico">⏳</div>
      <div>Cargando desde planilla...</div>
    </div>
  </div>

  <!-- FOOTER -->
  <div id="footer">
    <button class="btn-footer" id="btn-reload" onclick="cargar(true)">🔄 Recargar</button>
  </div>

<script>
// ══ HERRAMIENTAS · copihue-herramientas.html v2.0 ═══════════════════════════
// Lee hoja HERRAMIENTAS del panel de registro de apps (planilla nueva):
// NOMBRE | ver | URL | ICONO | DESCRIPCION | A | ID | COD | online | S | VUELVE | ESTADO | CUENTA/email | OBSERVACIONES
// Fuente: Code.gs → getHerramientas
// Regla de armado: CORRECTO = prioridad, tarjeta con link. Los demás (TRABAJANDO,
// ESPERAR, sin estado) = informativos, sección aparte, sin link clickeable a la app.
// ══════════════════════════════════════════════════════════════════════════

const API_URL = 'https://script.google.com/macros/s/AKfycbxZ2ZVMOXAVVAxCPmtGE8q_yQT6mQpTWcf-X0IrpjI7Tcyq1ub3xZCoFO3gKcvebKR3/exec';

let _todas = [];       // lista completa cargada
let _filtro = '';      // búsqueda activa

// ── CARGA ──────────────────────────────────────────────────────────────────
const CACHE_KEY = 'copihue_herramientas_cache_v2';
const CACHE_TTL = 10 * 60 * 1000; // 10 minutos

function cargarCache() {
  try {
    const raw = sessionStorage.getItem(CACHE_KEY);
    if (!raw) return false;
    const c = JSON.parse(raw);
    if (Date.now() - c.ts > CACHE_TTL) return false;
    _todas = c.herramientas;
    const mins = Math.round((Date.now() - c.ts) / 60000);
    setSub(_todas.length + ' herramientas · hace ' + (mins===0?'<1':mins) + 'min');
    renderizar();
    return true;
  } catch(e) { return false; }
}

async function cargar(forzar=false) {
  if (!forzar && cargarCache()) return;
  setSub('Conectando...');
  setEstado('⏳', 'Cargando desde planilla...');
  try {
    const r = await fetch(API_URL + '?action=getHerramientas&t=' + Date.now(), { cache: 'no-store' });
    const d = await r.json();
    if (d.status === 'ok' && Array.isArray(d.herramientas) && d.herramientas.length > 0) {
      _todas = d.herramientas;
      try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ts: Date.now(), herramientas: _todas})); } catch(e){}
      renderizar();
    } else {
      setEstado('⚠️', 'Sin herramientas en planilla', 'Verificar hoja HERRAMIENTAS en Sheets');
      setSub('Error al cargar');
    }
  } catch(e) {
    try {
      const raw = sessionStorage.getItem(CACHE_KEY);
      if (raw) { _todas = JSON.parse(raw).herramientas; renderizar(); setSub('Sin conexión · datos anteriores'); return; }
    } catch(e2){}
    setEstado('📵', 'Sin conexión con el servidor', 'Revisá conexión y tocá Recargar');
    setSub('Sin conexión');
  }
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function renderizar() {
  const q = _filtro.toLowerCase().trim();
  const lista = q
    ? _todas.filter(h =>
        (h.nombre||'').toLowerCase().includes(q) ||
        (h.descripcion||'').toLowerCase().includes(q) ||
        (h.estado||'').toLowerCase().includes(q) ||
        (h.observaciones||'').toLowerCase().includes(q))
    : _todas;

  const correctas = lista.filter(h => (h.estado||'').toUpperCase() === 'CORRECTO');
  const otras      = lista.filter(h => (h.estado||'').toUpperCase() !== 'CORRECTO');

  setSub(correctas.length + ' lista' + (correctas.length !== 1 ? 's' : '') +
    (otras.length ? ' · ' + otras.length + ' en trabajo' : ''));

  if (correctas.length === 0 && otras.length === 0) {
    document.getElementById('content').innerHTML =
      estado_html('🔍', q ? 'Sin resultados para "' + q + '"' : 'Sin herramientas cargadas.');
    return;
  }

  let html = '';

  html += `<div class="sec-title">✅ LISTAS <span class="sec-count">${correctas.length}</span></div>`;
  html += `<div id="grid-ok">`;
  if (correctas.length) {
    for (const h of correctas) html += cardOkHTML(h);
  } else {
    html += `<div style="grid-column:1/-1;color:#555;font-size:0.7rem;padding:6px 2px;">Ninguna todavía</div>`;
  }
  html += `</div>`;

  if (otras.length) {
    html += `<div class="sec-title">🔧 EN TRABAJO / PENDIENTES <span class="sec-count">${otras.length}</span></div>`;
    html += `<div id="list-otras">`;
    for (const h of otras) html += rowOtraHTML(h);
    html += `</div>`;
  }

  document.getElementById('content').innerHTML = html;
}

function cardOkHTML(h) {
  const url = (h.url || '').trim();
  const esLink = /^https?:\/\//i.test(url);
  const tag = esLink ? 'a' : 'div';
  const href = esLink ? ` href="${url}" target="_blank" rel="noopener"` : '';
  const cls = 'h-card' + (esLink ? '' : ' sin-link');
  return `<${tag}${href} class="${cls}">
    ${!esLink ? `<span class="h-card-nolink" title="Sin link directo">•</span>` : ''}
    <div class="h-card-badge">${escHtml(h.icono || 'APP')}</div>
    <div class="h-card-nom">${escHtml(h.nombre || '—')}</div>
    ${h.version ? `<div class="h-card-ver">v${escHtml(h.version)}</div>` : ''}
  </${tag}>`;
}

function rowOtraHTML(h) {
  const estadoUp = (h.estado || 'SIN ESTADO').toUpperCase();
  let claseFila = 'est-otro', claseTag = 'tag-otro';
  if (estadoUp === 'TRABAJANDO') { claseFila = 'est-trabajando'; claseTag = 'tag-trabajando'; }
  else if (estadoUp === 'ESPERAR') { claseFila = 'est-esperar'; claseTag = 'tag-esperar'; }

  const ultimaObs = ultimaObservacion(h.observaciones);

  return `<div class="h-row ${claseFila}">
    <div class="h-row-top">
      <div class="h-row-nom">${escHtml(h.nombre || '—')}</div>
      <div class="h-row-tags">
        ${h.version ? `<span class="tag tag-ver">v${escHtml(h.version)}</span>` : ''}
        ${h.vuelve ? `<span class="tag tag-vuelve">⏰ ${escHtml(h.vuelve)}</span>` : ''}
        <span class="tag ${claseTag}">${escHtml(estadoUp)}</span>
      </div>
    </div>
    ${ultimaObs ? `<div class="h-row-obs">${escHtml(ultimaObs)}</div>` : ''}
    ${h.cuenta ? `<div class="h-row-meta">${escHtml(h.cuenta)}</div>` : ''}
  </div>`;
}

// Toma el último tramo de OBSERVACIONES (separadas por " · [fecha] ")
function ultimaObservacion(obs) {
  if (!obs) return '';
  const partes = obs.split(' · ').map(p => p.trim()).filter(Boolean);
  if (!partes.length) return '';
  return partes[partes.length - 1];
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── HELPERS ────────────────────────────────────────────────────────────────
function setSub(txt) {
  document.getElementById('header-sub').textContent = txt;
}
function setEstado(ico, tit, sub) {
  document.getElementById('content').innerHTML =
    `<div id="estado">
      <div class="ico">${ico}</div>
      <div class="tit">${tit}</div>
      ${sub ? `<div class="sub">${sub}</div>` : ''}
    </div>`;
}
function estado_html(ico, tit, sub) {
  return `<div id="estado">
    <div class="ico">${ico}</div>
    <div class="tit" style="color:#888;">${tit}</div>
    ${sub ? `<div class="sub">${sub}</div>` : ''}
  </div>`;
}

// ── BÚSQUEDA ───────────────────────────────────────────────────────────────
let _searchTimer;
document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => {
    _filtro = this.value;
    if (_todas.length) renderizar();
  }, 180);
});

// ── INICIO ─────────────────────────────────────────────────────────────────
cargar();
// ══ FIN ═══════════════════════════════════════════════════════════════════
</script>
</body>
</html>
