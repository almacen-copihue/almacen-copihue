<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🔢 Puzzle · Copihue</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overscroll-behavior: contain; background: #000; }

  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    padding: 20px 14px 40px;
    color: #f2f2f2;
  }

  .header { text-align: center; margin-bottom: 6px; position: relative; width: 100%; max-width: 380px; }
  .header h1 {
    font-size: clamp(1.4rem, 6vw, 1.9rem); font-weight: 800; letter-spacing: 0.5px;
  }
  .header .tagline { font-size: 0.68rem; color: #666; letter-spacing: 3px; text-transform: uppercase; margin-top: 2px; }
  .app-version { position: absolute; top: 0; right: 4px; font-size: 0.6rem; color: #444; letter-spacing: 1px; }

  .stats {
    display: flex; gap: 20px; margin: 14px 0;
    background: #141414; padding: 8px 20px; border-radius: 12px;
    border: 1px solid #262626;
  }
  .stat { text-align: center; }
  .stat .num { font-size: 1.2rem; font-weight: 700; }
  .stat .lbl { font-size: 0.62rem; color: #666; text-transform: uppercase; letter-spacing: 1px; }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 6px;
    width: min(88vw, 340px);
    aspect-ratio: 1 / 1;
    background: #141414;
    border: 1px solid #262626;
    border-radius: 14px;
    padding: 8px;
    margin-top: 6px;
  }
  .tile {
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(1.1rem, 5.5vw, 1.6rem); font-weight: 700;
    border-radius: 8px;
    background: #1f2937;
    color: #e5e7eb;
    cursor: pointer;
    user-select: none;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .tile:active { transform: scale(0.94); }
  .tile.empty { background: transparent; cursor: default; }
  .tile.movable:hover { background: #29354a; }
  .tile.win-flash { background: #16311f; color: #4ade80; }

  .board.solved .tile { background: #16311f; color: #4ade80; }

  .controls { display: flex; gap: 10px; margin-top: 18px; }
  button.action {
    background: #f5c518; color: #1a1a1a; border: none;
    padding: 9px 20px; border-radius: 999px; font-weight: 700;
    font-family: inherit; font-size: 0.85rem; cursor: pointer;
  }
  button.action.secondary {
    background: transparent; color: #999; border: 1px solid #333;
  }

  .win {
    display: none; margin-top: 20px; text-align: center; max-width: 340px;
  }
  .win.show { display: block; }
  .win h2 { font-size: 1.15rem; font-weight: 800; color: #f5c518; }
  .win p { font-size: 0.85rem; color: #999; margin-top: 4px; }

  .ranking {
    margin-top: 18px; width: 100%; max-width: 380px;
    background: #141414; border: 1px solid #262626; border-radius: 14px; padding: 12px 16px;
  }
  .ranking h3 {
    font-size: 0.9rem; text-align: center; margin-bottom: 8px; color: #f5c518; font-weight: 700;
  }
  .ranking-row {
    display: grid; grid-template-columns: 22px 46px 1fr 55px;
    gap: 8px; align-items: center; font-size: 0.78rem;
    padding: 4px 0; border-bottom: 1px solid #222;
  }
  .ranking-row:last-child { border-bottom: none; }
  .ranking-row .pos { color: #555; font-weight: 700; }
  .ranking-row .ini { font-weight: 800; letter-spacing: 1px; color: #f5c518; }
  .ranking-row .det { color: #888; font-size: 0.7rem; }
  .ranking-row .pts { text-align: right; font-weight: 700; }
  .ranking-empty { text-align: center; font-size: 0.76rem; color: #666; padding: 6px 0; }

  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 999;
    background: rgba(0,0,0,0.75);
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.activo { display: flex; }
  .modal-box {
    background: #141414; border: 2px solid #f5c518; border-radius: 14px;
    padding: 22px 24px; max-width: 320px; width: 100%; text-align: center;
  }
  .modal-box .trofeo { font-size: 2rem; display: block; margin-bottom: 4px; }
  .modal-box h3 { color: #f5c518; font-size: 1.1rem; margin-bottom: 4px; font-weight: 800; }
  .modal-box p { color: #888; font-size: 0.76rem; margin-bottom: 16px; }
  .iniciales-inputs { display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; }
  .iniciales-inputs input {
    width: 46px; height: 56px; text-align: center; font-size: 1.5rem; font-weight: 800;
    text-transform: uppercase; font-family: inherit;
    background: #1f1f1f; color: #f5c518; border: 2px solid #333;
    border-radius: 8px; caret-color: #f5c518;
  }
  .iniciales-inputs input:focus { outline: none; border-color: #f5c518; }
  .btn-guardar-record {
    background: #f5c518; color: #1a1a1a; border: none; padding: 10px 24px;
    border-radius: 999px; font-weight: 700; cursor: pointer; font-size: 0.88rem; width: 100%;
    font-family: inherit;
  }
  .btn-guardar-record:disabled { opacity: 0.5; cursor: not-allowed; }

  footer { margin-top: 22px; font-size: 0.72rem; color: #444; text-align: center; }
</style>
</head>
<body>

<div class="header">
  <h1>🔢 Puzzle Numérico</h1>
  <div class="tagline">15 fichas · ordená del 1 al 15</div>
  <div class="app-version" id="appVersion"></div>
</div>

<div class="stats">
  <div class="stat"><div class="num" id="moves">0</div><div class="lbl">Movimientos</div></div>
  <div class="stat"><div class="num" id="time">00:00</div><div class="lbl">Tiempo</div></div>
</div>

<div class="board" id="board"></div>

<div class="controls">
  <button class="action" id="btnMezclar">🔀 Mezclar</button>
  <button class="action secondary" id="btnReiniciar">↺ Reiniciar</button>
</div>

<div class="win" id="win">
  <h2>🎉 ¡Resuelto!</h2>
  <p id="winText"></p>
</div>

<div class="ranking" id="ranking" style="display:none">
  <h3>🏆 Mejores puntajes</h3>
  <div id="rankingList"></div>
</div>

<div class="modal-overlay" id="modalIniciales">
  <div class="modal-box">
    <span class="trofeo">🏆</span>
    <h3>¡Nuevo record!</h3>
    <p>Entraste al top 10. Ingresá tus iniciales:</p>
    <div class="iniciales-inputs">
      <input type="text" maxlength="1" id="ini1" autocapitalize="characters">
      <input type="text" maxlength="1" id="ini2" autocapitalize="characters">
      <input type="text" maxlength="1" id="ini3" autocapitalize="characters">
    </div>
    <button class="btn-guardar-record" id="btnGuardarRecord" onclick="guardarIniciales()">Guardar</button>
  </div>
</div>

<footer>El Almacén Copihue 🌸</footer>

<script>
const APP_VERSION = 'v1.0';
document.getElementById('appVersion').textContent = APP_VERSION;

// Mismo backend compartido de records que memoria / sumas / multiplicación
const GAMES_URL = 'https://script.google.com/macros/s/AKfycbyegP1TSQSccsjYorXIpgAJH1nVAO9fzmg3hwKQNk116Mgx1M6Rs1XUn0JkiusVmGareg/exec';
const NOMBRE_JUEGO = 'puzzle';
const N = 4; // grilla 4x4, 15 fichas + 1 vacío

let tiles = [];       // 16 valores, 0 = vacío
let emptyIndex = 15;
let moves = 0;
let timer = null, seconds = 0, jugando = false;
let ultimoPuntaje = null;

function solvedState() {
  const arr = [];
  for (let i = 1; i <= 15; i++) arr.push(i);
  arr.push(0);
  return arr;
}

function estaResuelto(arr) {
  for (let i = 0; i < 15; i++) if (arr[i] !== i + 1) return false;
  return arr[15] === 0;
}

function vecinosDe(idx) {
  const row = Math.floor(idx / N), col = idx % N;
  const out = [];
  if (row > 0) out.push(idx - N);
  if (row < N - 1) out.push(idx + N);
  if (col > 0) out.push(idx - 1);
  if (col < N - 1) out.push(idx + 1);
  return out;
}

function mezclar() {
  tiles = solvedState();
  emptyIndex = 15;
  // Barajado válido: muchos movimientos aleatorios desde el estado resuelto
  let last = -1;
  for (let i = 0; i < 400; i++) {
    const vecinos = vecinosDe(emptyIndex).filter(v => v !== last);
    const next = vecinos[Math.floor(Math.random() * vecinos.length)];
    [tiles[emptyIndex], tiles[next]] = [tiles[next], tiles[emptyIndex]];
    last = emptyIndex;
    emptyIndex = next;
  }
  moves = 0;
  seconds = 0;
  jugando = true;
  document.getElementById('moves').textContent = '0';
  document.getElementById('time').textContent = '00:00';
  document.getElementById('win').classList.remove('show');
  document.getElementById('ranking').style.display = 'none';
  document.getElementById('board').classList.remove('solved');
  clearInterval(timer);
  timer = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    document.getElementById('time').textContent = `${m}:${s}`;
  }, 1000);
  render();
}

function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const movibles = vecinosDe(emptyIndex);
  tiles.forEach((val, idx) => {
    const div = document.createElement('div');
    if (val === 0) {
      div.className = 'tile empty';
    } else {
      div.className = 'tile' + (movibles.includes(idx) ? ' movable' : '');
      div.textContent = val;
      div.addEventListener('click', () => intentarMover(idx));
    }
    board.appendChild(div);
  });
}

function intentarMover(idx) {
  if (!jugando) return;
  if (!vecinosDe(emptyIndex).includes(idx)) return;
  [tiles[emptyIndex], tiles[idx]] = [tiles[idx], tiles[emptyIndex]];
  emptyIndex = idx;
  moves++;
  document.getElementById('moves').textContent = moves;
  render();
  if (estaResuelto(tiles)) {
    ganar();
  }
}

// Soporte de flechas del teclado: mueve la ficha en esa dirección hacia el vacío
document.addEventListener('keydown', (e) => {
  if (!jugando) return;
  const row = Math.floor(emptyIndex / N), col = emptyIndex % N;
  let target = null;
  if (e.key === 'ArrowUp' && row < N - 1) target = emptyIndex + N;
  if (e.key === 'ArrowDown' && row > 0) target = emptyIndex - N;
  if (e.key === 'ArrowLeft' && col < N - 1) target = emptyIndex + 1;
  if (e.key === 'ArrowRight' && col > 0) target = emptyIndex - 1;
  if (target !== null) { e.preventDefault(); intentarMover(target); }
});

async function ganar() {
  jugando = false;
  clearInterval(timer);
  document.getElementById('board').classList.add('solved');
  const m = String(Math.floor(seconds / 60)).padStart(2, '0');
  const s = String(seconds % 60).padStart(2, '0');
  const tiempoTexto = `${m}:${s}`;
  document.getElementById('winText').textContent = `${moves} movimientos en ${tiempoTexto}`;
  document.getElementById('win').classList.add('show');

  const puntaje = Math.max(0, 500 - (moves * 3) - (seconds * 2));
  const detalle = `${moves} mov · ${tiempoTexto}`;
  ultimoPuntaje = { puntaje, detalle };

  try {
    const res = await fetchGames('obtenerRecords', { juego: NOMBRE_JUEGO });
    const records = (res.ok && res.records) ? res.records : [];
    const entraAlTop = records.length < 10 || puntaje > records[records.length - 1].puntaje;
    mostrarRanking(records);
    if (entraAlTop) abrirModalIniciales();
  } catch (err) {
    console.error('No se pudo consultar el ranking:', err);
  }
}

async function fetchGames(action, data) {
  let url = GAMES_URL + '?action=' + action;
  if (data) url += '&data=' + encodeURIComponent(JSON.stringify(data));
  const r = await fetch(url);
  return r.json();
}

function mostrarRanking(records) {
  const cont = document.getElementById('rankingList');
  document.getElementById('ranking').style.display = 'block';
  if (!records || records.length === 0) {
    cont.innerHTML = '<div class="ranking-empty">Todavía no hay puntajes registrados. ¡Sé el primero!</div>';
    return;
  }
  cont.innerHTML = records.map((r, i) => `
      <div class="ranking-row">
        <span class="pos">${i + 1}º</span>
        <span class="ini">${r.iniciales}</span>
        <span class="det">${r.detalle}</span>
        <span class="pts">${r.puntaje}</span>
      </div>`).join('');
}

function abrirModalIniciales() {
  document.getElementById('ini1').value = '';
  document.getElementById('ini2').value = '';
  document.getElementById('ini3').value = '';
  document.getElementById('modalIniciales').classList.add('activo');
  setTimeout(() => document.getElementById('ini1').focus(), 100);
}

async function guardarIniciales() {
  const i1 = document.getElementById('ini1').value.trim();
  const i2 = document.getElementById('ini2').value.trim();
  const i3 = document.getElementById('ini3').value.trim();
  const iniciales = (i1 + i2 + i3).toUpperCase() || '???';

  const btn = document.getElementById('btnGuardarRecord');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  try {
    await fetchGames('guardarRecord', {
      juego: NOMBRE_JUEGO,
      iniciales,
      puntaje: ultimoPuntaje.puntaje,
      detalle: ultimoPuntaje.detalle
    });
    const res = await fetchGames('obtenerRecords', { juego: NOMBRE_JUEGO });
    if (res.ok && res.records) mostrarRanking(res.records);
  } catch (err) {
    console.error('No se pudo guardar el récord:', err);
  } finally {
    document.getElementById('modalIniciales').classList.remove('activo');
    btn.disabled = false;
    btn.textContent = 'Guardar';
  }
}

// Auto-avanzar entre los 3 casilleros de iniciales, como en los arcades
['ini1', 'ini2', 'ini3'].forEach((id, idx, arr) => {
  document.getElementById(id).addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/[^a-zA-Z]/g, '').toUpperCase();
    if (e.target.value && idx < arr.length - 1) {
      document.getElementById(arr[idx + 1]).focus();
    }
  });
});

document.getElementById('btnMezclar').addEventListener('click', mezclar);
document.getElementById('btnReiniciar').addEventListener('click', mezclar);

mezclar();
</script>
</body>
</html>
