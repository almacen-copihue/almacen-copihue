<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SendWA — Almacén Copihue</title>
<style>
  :root {
    --primary: #4a7c3f;
    --primary-dark: #2d5a22;
    --accent: #c0392b;
    --bg: #f5f7f4;
    --card-bg: #ffffff;
    --text: #1a2e17;
    --text-muted: #5a7055;
    --border: #d4e4cf;
    --selected-border: #27ae60;
    --selected-bg: #eafaf1;
    --header-h: 56px;
  }
  [data-theme="dark"] {
    --bg: #111a0e;
    --card-bg: #1c2b18;
    --text: #e8f5e3;
    --text-muted: #8db885;
    --border: #2d4528;
    --selected-bg: #1a3d24;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; transition: background .3s, color .3s;
  }

  /* HEADER */
  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: var(--header-h); background: var(--primary-dark);
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
  }
  #header h1 { flex: 1; font-size: 16px; color: #fff; font-weight: 700; }
  #header h1 span { color: #a8d8a0; font-size: 11px; font-weight: 400; display: block; }
  .btn-icon {
    width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.15);
    color: #fff; font-size: 16px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  /* BARRA DE FILTROS */
  #filter-bar {
    position: fixed; top: var(--header-h); left: 0; right: 0; z-index: 95;
    background: #1a4a12; display: flex; gap: 6px; padding: 8px 10px;
    overflow-x: auto; scrollbar-width: none;
  }
  .fbar-btn {
    height: 30px; padding: 0 12px; border-radius: 15px; flex-shrink: 0;
    font-size: 12px; font-weight: 700; cursor: pointer; border: none; color: #fff;
    background: rgba(255,255,255,.2);
  }
  .fbar-btn.active { background: #27ae60; }

  /* BÚSQUEDA PANEL */
  #search-box {
    display: none; padding: 8px 10px; background: var(--card-bg);
    border-bottom: 1px solid var(--border);
  }
  #search-box.open { display: block; }
  #search-input {
    width: 100%; height: 36px; padding: 0 12px; border-radius: 8px;
    border: 1.5px solid var(--border); background: var(--bg); color: var(--text);
  }

  /* MAIN GRID */
  #main { padding: 105px 8px 80px 8px; }
  #grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }

  /* TARJETAS DE PRODUCTO */
  .prod-card {
    background: var(--card-bg); border: 2px solid var(--border);
    border-radius: 10px; overflow: hidden; cursor: pointer;
    transition: transform .1s, border-color .15s; user-select: none;
  }
  .prod-card:active { transform: scale(0.97); }
  .prod-card.selected {
    border-color: var(--selected-border); background: var(--selected-bg);
  }
  .card-img {
    width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #e0e0e0; display: block;
  }
  .card-body { padding: 6px; }
  .card-name { font-size: 11px; font-weight: 700; line-height: 1.2; margin-bottom: 4px; }
  .price-normal { font-size: 10px; color: var(--text-muted); text-decoration: line-through; }
  .price-actual { font-size: 12px; font-weight: 800; color: var(--primary-dark); }
  
  /* Ocultar precios dinámicamente */
  .hide-normal .price-normal { display: none !important; }
  .hide-actual .price-actual { display: none !important; }

  /* ESTILOS DE LAYOUT DINÁMICOS */
  #grid.layout-expandido { grid-template-columns: repeat(1, 1fr); }
  #grid.layout-2horiz { grid-template-columns: repeat(2, 1fr); }
  #grid.layout-2vert { grid-template-columns: repeat(2, 1fr); }

  /* BOTONES FLOTANTES (FAB) */
  #fab-panel {
    position: fixed; bottom: 15px; right: 15px; z-index: 200;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  }
  .fab-main {
    width: 48px; height: 48px; border-radius: 50%; background: var(--primary-dark);
    color: #fff; font-size: 20px; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.3);
  }
  .fab-menu {
    display: none; flex-direction: column; gap: 6px; align-items: flex-end;
  }
  .fab-menu.open { display: flex; }
  .fab-action {
    height: 36px; padding: 0 14px; border-radius: 18px; background: var(--primary);
    color: #fff; font-weight: 700; font-size: 12px; border: none; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }

  /* MODAL CONFIGURACIÓN */
  #modal {
    display: none; position: fixed; inset: 0; z-index: 500;
    background: rgba(0,0,0,.6); align-items: flex-end; justify-content: center;
  }
  #modal.open { display: flex; }
  #modal-content {
    background: var(--card-bg); border-radius: 16px 16px 0 0;
    width: 100%; max-width: 500px; padding: 18px; max-height: 85vh; overflow-y: auto;
  }
  .modal-title { font-size: 15px; font-weight: 800; margin-bottom: 12px; display: flex; justify-content: space-between; }
  .tab-group, .btn-group { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tab-btn, .opt-btn {
    flex: 1; min-width: 70px; padding: 8px; border-radius: 8px; border: 1.5px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 11px; font-weight: 700; cursor: pointer; text-align: center;
  }
  .tab-btn.active, .opt-btn.active {
    background: var(--primary); color: #fff; border-color: var(--primary);
  }
  .setting-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px; background: var(--bg); border-radius: 8px; margin-bottom: 8px;
  }

  /* TOAST */
  #toast {
    position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
    background: #111; color: #fff; padding: 8px 16px; border-radius: 20px;
    font-size: 12px; font-weight: 600; opacity: 0; transition: opacity .2s; z-index: 600; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <h1>SendWA <span>Almacén Copihue</span></h1>
  <button class="btn-icon" onclick="toggleDarkMode()">🌙</button>
</div>

<!-- FILTROS Y BÚSQUEDA -->
<div id="filter-bar">
  <button class="fbar-btn active" onclick="filtrar('todos', this)">Todos</button>
  <button class="fbar-btn" onclick="filtrar('ofertas', this)">🔥 Ofertas</button>
  <button class="fbar-btn" onclick="filtrar('almacen', this)">📦 Almacén</button>
  <button class="fbar-btn" onclick="toggleSearch()">🔍 Buscar</button>
</div>

<div id="search-box">
  <input type="text" id="search-input" placeholder="Buscar producto..." oninput="buscarProductos(this.value)">
</div>

<!-- CONTENEDOR DE PRODUCTOS -->
<div id="main">
  <div id="grid"></div>
</div>

<!-- FAB ACCIONES -->
<div id="fab-panel">
  <div class="fab-menu" id="fab-menu">
    <button class="fab-action" onclick="abrirModal()">🎨 Configurar Diseño</button>
    <button class="fab-action" style="background:var(--accent)" onclick="limpiarSeleccion()">🗑️ Limpiar Selección</button>
  </div>
  <button class="fab-main" onclick="toggleFabMenu()">⚙️</button>
</div>

<!-- MODAL DE CONFIGURACIÓN DE DISEÑO -->
<div id="modal">
  <div id="modal-content">
    <div class="modal-title">
      <span>🎨 Configuración de Formato</span>
      <span style="cursor:pointer" onclick="cerrarModal()">✕</span>
    </div>

    <!-- Pestañas de Modo -->
    <div class="tab-group">
      <button class="tab-btn active" onclick="setModo('single', this)">📸 1 Foto (1:1)</button>
      <button class="tab-btn" onclick="setModo('collage', this)">🖼️ Collage</button>
      <button class="tab-btn" onclick="setModo('historia', this)">📱 Historia</button>
    </div>

    <!-- Opciones de Estilo / Layout -->
    <div style="font-size:12px; font-weight:700; margin-bottom:6px;">Estilo de Grilla</div>
    <div class="btn-group">
      <button class="opt-btn active" onclick="setLayout('clasico', this)">Clásico (3 Col)</button>
      <button class="opt-btn" onclick="setLayout('expandido', this)">Expandido (1 Col)</button>
      <button class="opt-btn" onclick="setLayout('2horiz', this)">2 Col Grid</button>
    </div>

    <!-- Control de Visibilidad de Precios -->
    <div style="font-size:12px; font-weight:700; margin-bottom:6px; margin-top:10px;">Visibilidad de Precios</div>
    <div class="setting-row">
      <span style="font-size:12px; font-weight:600;">Precio Anterior (Tachado)</span>
      <input type="checkbox" id="chk-normal" checked onchange="togglePrecio('normal', this.checked)">
    </div>
    <div class="setting-row">
      <span style="font-size:12px; font-weight:600;">Precio Oferta / Venta</span>
      <input type="checkbox" id="chk-actual" checked onchange="togglePrecio('actual', this.checked)">
    </div>

    <button onclick="cerrarModal()" style="width:100%; height:38px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-weight:700; margin-top:10px; cursor:pointer;">
      ✅ Guardar y Aplicar
    </button>
  </div>
</div>

<div id="toast"></div>

<script>
  // DATOS DE MUESTRA (Base de datos recuperada)
  const productos = [
    { id: 1, nombre: "Aceite de Girasol 1.5L", precioNormal: "$2.800", precioActual: "$2.200", esOferta: true, cat: "almacen", img: "https://picsum.photos/seed/aceite/300/300" },
    { id: 2, nombre: "Yerba Mate Orgánica 500g", precioNormal: "$3.100", precioActual: "$2.650", esOferta: true, cat: "almacen", img: "https://picsum.photos/seed/yerba/300/300" },
    { id: 3, nombre: "Fideos Broca 500g", precioNormal: "$1.200", precioActual: "$990", esOferta: false, cat: "almacen", img: "https://picsum.photos/seed/fideos/300/300" },
    { id: 4, nombre: "Leche Entera 1L", precioNormal: "$1.400", precioActual: "$1.150", esOferta: true, cat: "almacen", img: "https://picsum.photos/seed/leche/300/300" },
    { id: 5, nombre: "Café Molido 250g", precioNormal: "$4.500", precioActual: "$3.900", esOferta: false, cat: "almacen", img: "https://picsum.photos/seed/cafe/300/300" },
    { id: 6, nombre: "Galletitas Dulces Surtidas", precioNormal: "$1.800", precioActual: "$1.450", esOferta: true, cat: "almacen", img: "https://picsum.photos/seed/galletas/300/300" }
  ];

  let seleccionados = new Set();

  // RENDERIZADO INICIAL
  function renderProductos(lista) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    lista.forEach(p => {
      const card = document.createElement('div');
      card.className = `prod-card ${seleccionados.has(p.id) ? 'selected' : ''}`;
      card.onclick = () => toggleSeleccion(p.id, card);

      card.innerHTML = `
        <img src="${p.img}" class="card-img" alt="${p.nombre}" loading="lazy">
        <div class="card-body">
          <div class="card-name">${p.nombre}</div>
          <div class="price-normal">${p.precioNormal}</div>
          <div class="price-actual">${p.precioActual}</div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // SELECCIÓN DE TARJETAS
  function toggleSeleccion(id, cardEl) {
    if (seleccionados.has(id)) {
      seleccionados.delete(id);
      cardEl.classList.remove('selected');
    } else {
      seleccionados.add(id);
      cardEl.classList.add('selected');
    }
    showToast(`${seleccionados.size} producto(s) seleccionado(s)`);
  }

  function limpiarSeleccion() {
    seleccionados.clear();
    document.querySelectorAll('.prod-card').forEach(c => c.classList.remove('selected'));
    showToast('Selección limpiada');
  }

  // FILTROS Y BÚSQUEDA
  function filtrar(tipo, btn) {
    document.querySelectorAll('.fbar-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    if (tipo === 'ofertas') {
      renderProductos(productos.filter(p => p.esOferta));
    } else if (tipo === 'almacen') {
      renderProductos(productos.filter(p => p.cat === 'almacen'));
    } else {
      renderProductos(productos);
    }
  }

  function toggleSearch() {
    const box = document.getElementById('search-box');
    box.classList.toggle('open');
    if (box.classList.contains('open')) {
      document.getElementById('search-input').focus();
    }
  }

  function buscarProductos(q) {
    const term = q.toLowerCase();
    const filtrados = productos.filter(p => p.nombre.toLowerCase().includes(term));
    renderProductos(filtrados);
  }

  // CONTROLES DE INTERFAZ Y MODAL
  function toggleFabMenu() {
    document.getElementById('fab-menu').classList.toggle('open');
  }

  function abrirModal() {
    document.getElementById('modal').classList.add('open');
    document.getElementById('fab-menu').classList.remove('open');
  }

  function cerrarModal() {
    document.getElementById('modal').classList.remove('open');
  }

  function toggleDarkMode() {
    document.body.toggleAttribute('data-theme');
  }

  // CONFIGURACIÓN DE DISEÑO (MODO, LAYOUT Y PRECIOS)
  function setModo(modo, btn) {
    btn.parentElement.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    showToast(`Modo cambiado a: ${modo.toUpperCase()}`);
  }

  function setLayout(layout, btn) {
    btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const grid = document.getElementById('grid');
    grid.className = ''; // limpiar clases
    if (layout === 'expandido') grid.classList.add('layout-expandido');
    if (layout === '2horiz') grid.classList.add('layout-2horiz');
    showToast(`Diseño aplicado: ${layout}`);
  }

  function togglePrecio(tipo, visible) {
    const grid = document.getElementById('grid');
    if (tipo === 'normal') {
      grid.classList.toggle('hide-normal', !visible);
    } else if (tipo === 'actual') {
      grid.classList.toggle('hide-actual', !visible);
    }
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  // CARGA INICIAL
  document.addEventListener('DOMContentLoaded', () => {
    renderProductos(productos);
  });
</script>
</body>
</html>
